  opts: [
    { t: 'Die Gesamtenergie ist zu jedem Zeitpunkt gleich.', ok: true },
    { t: 'Die Kurven von $\\Ekin$ und $\\Eel$ haben die Periode $T/2$.', ok: true },
    { t: 'Am Umkehrpunkt ist die gesamte Energie Elongationsenergie.', ok: true },
    { t: 'Die kinetische Energie wird zwischendurch negativ.', tag: 'EPER' },
    { t: 'In der Gleichgewichtslage ist die Elongationsenergie maximal.', tag: 'VMAX' }],
  exp: 'Energie wird zwischen zwei Formen hin- und hergeschoben, die Summe bleibt konstant. Beide Teilenergien sind Quadrate ($s^2$ bzw. $v^2$), deshalb nie negativ und zweimal pro Periode maximal.',
  learn: 'Kennzeichen jeder mechanischen Schwingung: periodisches Hin- und Herpendeln zwischen zwei Energieformen.' },

{ id: 'e8', area: 'energie', afb: 2, type: 'mc',
  q: 'Beim senkrecht hängenden Federpendel ändern sich Spannenergie und Lageenergie. Warum reicht trotzdem $\\Eges = \\Ekin + \\frac12 D s^2$, wenn man $s$ ab der Ruhelage misst?',
  opts: [
    { t: R`Spann- und Lageenergie ergeben zusammen $\frac12 D s^2$ plus eine Konstante.`, ok: true },
    { t: 'Weil die Lageenergie beim Federpendel immer null ist.' },
    { t: 'Weil die Gewichtskraft beim Schwingen keine Arbeit verrichtet.' },
    { t: 'Weil die Feder keine Masse hat.' }],
  exp: 'Die Gewichtskraft verschiebt nur die Gleichgewichtslage um $s_0$. Misst man ab dieser Ruhelage, fassen sich Spann- und Lageenergie zu $\\frac12 D s^2$ + konstant zusammen. Eine Konstante ändert an der Schwingung nichts.',
  learn: '$\\Eges = \\Ekin + E_{\\text{Spann}} + E_{\\text{Lage}} = \\Ekin + \\frac12 D s^2 + \\text{konst.}$ (Mitschrift S. 9).' },

{ id: 'e9', area: 'energie', afb: 3, type: 'num', unit: 'cm', ask: '|s| =',
  gen: r => ({ s: between(r, 4, 12, 1) }),
  q: p => `Ein Federpendel schwingt ungedämpft mit der Amplitude ${p.s} cm. Bei welchem Abstand von der Gleichgewichtslage ist seine Geschwindigkeit halb so groß wie $\\vh$?`,
  ans: p => p.s * Math.sqrt(3) / 2, tol: { rel: 0.02 },
  traps: p => [{ v: p.s / 2, tag: 'HALF' }, { v: p.s / Math.SQRT2, tag: 'HALF' }],
  exp: p => `Bei $v = \\frac{\\vh}{2}$ ist $\\Ekin = \\frac14\\Eges$, also $\\Eel = \\frac34\\Eges$: $\\frac12 D s^2 = \\frac34\\cdot\\frac12 D\\sh^2$. Daraus $s = \\sh\\sqrt{\\frac34} = ${p.s}\\,\\text{cm}\\cdot 0{,}866\\approx ${sig(p.s * Math.sqrt(3) / 2, 3)}\\,\\text{cm}$.`,
  learn: 'Energie aufteilen: $\\Ekin\\sim v^2$ und $\\Eel\\sim s^2$, beide zusammen = $\\Eges$.' },

{ id: 'e10', area: 'energie', afb: 3, type: 'self',
  q: R`Zeige durch Rechnung, dass in $\Eges = \frac12 D\cdot s(t)^2 + \frac12 m\cdot v(t)^2$ auch $\Eges = \frac12 m\vh^2 = \frac12 D\sh^2$ steckt, also dass die Gesamtenergie konstant ist.`,
  model: R`Einsetzen von $s(t) = \sh\sin(\omega t)$ und $v(t) = \vh\cos(\omega t)$: $\Eges = \frac12 D\sh^2\sin^2(\omega t) + \frac12 m\vh^2\cos^2(\omega t)$. Mit $D = m\omega^2$ und $\vh = \sh\omega$: $\Eges = \frac12 m\omega^2\sh^2\sin^2(\omega t) + \frac12 m\omega^2\sh^2\cos^2(\omega t)$. Ausklammern: $\Eges = \frac12 m\omega^2\sh^2\,(\sin^2(\omega t) + \cos^2(\omega t)) = \frac12 m\omega^2\sh^2\cdot 1 = \frac12 m\vh^2 = \frac12 D\sh^2$. Das hängt nicht von $t$ ab, also ist die Gesamtenergie konstant.`,
  rubric: [
    '$s(t) = \\sh\\sin(\\omega t)$ und $v(t) = \\vh\\cos(\\omega t)$ eingesetzt.',
    '$D = m\\omega^2$ und $\\vh = \\sh\\omega$ benutzt, damit vor $\\sin^2$ und $\\cos^2$ dasselbe steht.',
    'Den gemeinsamen Faktor $\\frac12 m\\omega^2\\sh^2$ ausgeklammert.',
    '$\\sin^2(\\omega t) + \\cos^2(\\omega t) = 1$ angewendet.',
    'Ergebnis $\\frac12 m\\vh^2 = \\frac12 D\\sh^2$, unabhängig von $t$, also konstant.'],
  learn: 'Beweis: einsetzen, $D = m\\omega^2$ und $\\vh = \\sh\\omega$, ausklammern, $\\sin^2+\\cos^2 = 1$ (Mitschrift S. 10).' }
);

Q.push(
{ id: 'y1', area: 'systeme', afb: 2, type: 'mc',
  q: 'Welche Masse setzt man beim Flüssigkeitspendel (U-Rohr) in $T = 2\\pi\\sqrt{m/D}$ ein?',
  opts: [{ t: R`die gesamte Flüssigkeit: $m = \rho\cdot A\cdot L$`, ok: true }, { t: R`nur die überstehende Säule der Länge $2s$`, tag: 'UROHR' }, { t: 'die Hälfte der Flüssigkeit', tag: 'UROHR' }, { t: 'die Masse des Glasrohrs' }],
  exp: 'Die Säule der Länge $2s$ liefert nur die Rückstellkraft. Beschleunigt wird aber die ganze Flüssigkeit im Rohr. Deshalb $m = \\rho A L$ und $D = 2\\rho A g$.',
  learn: 'U-Rohr: $D = 2\\rho A g$ (Säule $2s$), $m = \\rho A L$ (alles), $T = 2\\pi\\sqrt{L/(2g)}$.' },

{ id: 'y2', area: 'systeme', afb: 2, type: 'num', unit: 's', ask: 'T =',
  gen: r => ({ L: between(r, 30, 120, 5) }),
  q: p => `Die Wassersäule in einem U-Rohr ist insgesamt ${p.L} cm lang. Berechne die Periodendauer der Schwingung.`,
  ans: p => 2 * Math.PI * Math.sqrt(p.L / 100 / (2 * G)), tol: { rel: 0.02 },
  traps: p => [{ v: 2 * Math.PI * Math.sqrt(p.L / 100 / G), tag: 'faktor2' }],
  exp: p => `$T = 2\\pi\\sqrt{\\frac{L}{2g}} = 2\\pi\\sqrt{\\frac{${nf(p.L / 100, 2)}\\,\\text{m}}{2\\cdot 9{,}81\\,\\text{m/s}^2}}\\approx ${sig(2 * Math.PI * Math.sqrt(p.L / 100 / (2 * G)), 3)}\\,\\text{s}$. Dichte und Querschnitt kürzen sich heraus.`,
  learn: 'U-Rohr: $T = 2\\pi\\sqrt{L/(2g)}$ mit der Gesamtlänge $L$ in m.' },

{ id: 'y3', area: 'systeme', afb: 2, type: 'mc',
  q: 'Man füllt das U-Rohr mit Öl statt mit Wasser, die Säulenlänge bleibt gleich. Was passiert mit der Periodendauer?',
  opts: [{ t: 'Sie bleibt gleich, weil sich die Dichte herauskürzt.', ok: true }, { t: 'Sie wird größer, weil Öl zäher ist.' }, { t: 'Sie wird kleiner, weil Öl leichter ist.' }, { t: 'Sie wird größer, weil die Masse kleiner wird.' }],
  exp: 'In $T = 2\\pi\\sqrt{\\frac{\\rho A L}{2\\rho A g}}$ stehen Dichte und Querschnitt oben und unten. Es bleibt $T = 2\\pi\\sqrt{\\frac{L}{2g}}$. (Bei zähen Flüssigkeiten wäre die Schwingung stärker gedämpft, aber $T$ ändert sich kaum.)',
  learn: 'Beim U-Rohr kürzen sich $\\rho$ und $A$: Nur $L$ und $g$ bestimmen $T$.' },

{ id: 'y4', area: 'systeme', afb: 2, type: 'mc',
  q: 'Ein Wagen ist waagerecht zwischen zwei Federn mit $D_1$ und $D_2$ eingespannt. Welche Richtgröße hat das System?',
  opts: [{ t: R`$D = D_1 + D_2$`, ok: true }, { t: R`$D = \frac{D_1 + D_2}{2}$`, tag: 'DSUM' }, { t: R`$D = \frac{D_1\cdot D_2}{D_1 + D_2}$`, tag: 'DSUM' }, { t: R`$D = |D_1 - D_2|$`, tag: 'DSUM' }],
  exp: 'Wird der Wagen um $s$ nach rechts ausgelenkt, wird die linke Feder gedehnt und die rechte gestaucht. Beide ziehen bzw. drücken nach links: $\\Fr = -D_1 s - D_2 s = -(D_1 + D_2)\\cdot s$.',
  learn: 'Doppeltes Federpendel: $\\Fr = -(D_1+D_2)\\cdot s$, also harmonisch mit $D = D_1 + D_2$.' },

{ id: 'y5', area: 'systeme', afb: 3, type: 'num', unit: 's', ask: 'T =',
  gen: r => ({ m: between(r, 20, 80, 5), A: pick(r, [1.5, 2, 2.5, 3, 4]) }),
  q: p => `Ein Reagenzglas ($m = ${p.m}\\,\\text{g}$, Querschnitt $A = ${nf(p.A, 1)}\\,\\text{cm}^2$) schwimmt aufrecht in Wasser ($\\rho_W = 1000\\,\\frac{\\text{kg}}{\\text{m}^3}$). Taucht es um $s$ tiefer ein, wächst der Auftrieb um $\\rho_W\\cdot g\\cdot A\\cdot s$. Berechne die Periodendauer der Auf-und-ab-Schwingung.`,
  ans: p => 2 * Math.PI * Math.sqrt((p.m / 1000) / (1000 * G * p.A * 1e-4)), tol: { rel: 0.02 },
  traps: p => [{ v: 2 * Math.PI * Math.sqrt(p.m / (1000 * G * p.A * 1e-4)), tag: 'einheit' }, { v: Math.sqrt((p.m / 1000) / (1000 * G * p.A * 1e-4)), tag: 'zweipi' }],
  exp: p => { const D = 1000 * G * p.A * 1e-4; return `Die zusätzliche Auftriebskraft wirkt als Rückstellkraft: $\\Fr = -\\rho_W g A\\cdot s$, also harmonisch mit $D = \\rho_W g A = 1000\\cdot 9{,}81\\cdot ${nf(p.A * 1e-4, 6)}\\,\\frac{\\text{N}}{\\text{m}}\\approx ${sig(D, 3)}\\,\\frac{\\text{N}}{\\text{m}}$. Dann $T = 2\\pi\\sqrt{\\frac{${nf(p.m / 1000, 3)}\\,\\text{kg}}{${sig(D, 3)}\\,\\text{N/m}}}\\approx ${sig(2 * Math.PI * Math.sqrt((p.m / 1000) / D), 3)}\\,\\text{s}$.`; },
  learn: 'Schwimmendes Rohr: $D = \\rho_W g A$. Umrechnen: $1\\,\\text{cm}^2 = 10^{-4}\\,\\text{m}^2$, g in kg.' },

{ id: 'y6', area: 'systeme', afb: 3, type: 'mc',
  q: 'Warum würde ein Körper in einem Tunnel quer durch eine (homogene) Erde ohne Luftreibung harmonisch schwingen?',
  opts: [
    { t: R`Im Inneren ist die Gravitationskraft proportional zum Abstand vom Mittelpunkt und zeigt zur Mitte: $F = -\frac{m g}{R}\cdot s$.`, ok: true },
    { t: 'Weil die Gewichtskraft überall im Tunnel gleich groß ist.', tag: 'CONST' },
    { t: 'Weil sich die Erde dreht.' },
    { t: 'Weil der Körper am Ende des Tunnels zurückprallt.' }],
  exp: 'Nach innen zählt nur die Masse innerhalb des Abstands $r$, deshalb wächst die Kraft linear mit $r$. Das ist ein lineares Kraftgesetz mit $D = \\frac{m g}{R}$, also $T = 2\\pi\\sqrt{R/g}\\approx 84\\,\\text{min}$. Durch die Erde fällt man in etwa 42 Minuten.',
  learn: 'Neue Systeme prüfen: Gilt $F\\sim -s$? Dann harmonisch mit $T = 2\\pi\\sqrt{m/D}$.' },

{ id: 'y7', area: 'systeme', afb: 2, type: 'mc',
  q: 'Beim Drehpendel (Pohlsches Rad) gilt $M = -D^*\\cdot\\varphi$. Welche Größe übernimmt dort die Rolle der Masse in $T = 2\\pi\\sqrt{m/D}$?',
  opts: [{ t: R`das Trägheitsmoment $J$`, ok: true }, { t: R`die Winkelrichtgröße $D^*$` }, { t: R`das Drehmoment $M$` }, { t: R`der Drehwinkel $\varphi$` }],
  exp: 'Die Drehbewegung ist ganz analog zur Translation: Masse ↔ Trägheitsmoment, Kraft ↔ Drehmoment, $D$ ↔ $D^*$. Deshalb $T = 2\\pi\\sqrt{J/D^*}$.',
  learn: 'Drehpendel: $M = -D^*\\varphi$ ⇒ harmonisch, $T = 2\\pi\\sqrt{J/D^*}$.' },

{ id: 'y8', area: 'systeme', afb: 3, type: 'num', unit: 'N/m', ask: 'D =',
  gen: r => ({ m: between(r, 40, 90, 5), s: between(r, 15, 35, 1) }),
  q: p => `Ein Trampolin lässt sich als Platte auf vier gleichen Federn auffassen. Steht eine Person (${p.m} kg) in der Mitte, senkt sich die Platte um ${p.s} cm. Berechne die Federkonstante <b>einer</b> Feder.`,
  ans: p => p.m * G / (p.s / 100) / 4, tol: { rel: 0.02 },
  traps: p => [{ v: p.m * G / (p.s / 100), tag: 'federn' }],
  exp: p => `Alle vier Federn tragen gemeinsam: $4D\\cdot s = m g$. Also $D = \\frac{m g}{4 s} = \\frac{${p.m}\\cdot 9{,}81}{4\\cdot ${nf(p.s / 100, 2)}}\\,\\frac{\\text{N}}{\\text{m}}\\approx ${sig(p.m * G / (p.s / 100) / 4, 3)}\\,\\frac{\\text{N}}{\\text{m}}$.`,
  learn: 'Mehrere gleiche Federn nebeneinander: $D_{\\text{gesamt}} = n\\cdot D$.' },

{ id: 'y9', area: 'systeme', afb: 3, type: 'self',
  q: 'Zeige rechnerisch, dass die Flüssigkeit in einem U-Rohr harmonisch schwingt, und leite die Periodendauer her. (Querschnitt $A$, Dichte $\\rho$, Gesamtlänge der Flüssigkeitssäule $L$.)',
  model: R`Steigt die Flüssigkeit rechts um $s$, sinkt sie links um $s$. Eine Säule der Länge $2s$ steht über, ihr Gewicht wirkt als Rückstellkraft: $\Fr = -m_{2s}\cdot g = -\rho\cdot A\cdot 2s\cdot g = -D\cdot s$ mit $D = 2\rho A g$. $D$ ist konstant, also gilt das lineare Kraftgesetz und die Schwingung ist harmonisch. Beschleunigt wird die gesamte Flüssigkeit, $m = \rho A L$. Damit $T = 2\pi\sqrt{\frac{\rho A L}{2\rho A g}} = 2\pi\sqrt{\frac{L}{2g}}$.`,
  rubric: [
    'Steigt die Flüssigkeit rechts um $s$, sinkt sie links um $s$; eine Säule der Länge $2s$ steht über.',
    'Rückstellkraft = Gewicht dieser Säule: $\\Fr = -\\rho A\\cdot 2s\\cdot g$.',
    '$\\Fr = -D\\cdot s$ mit konstantem $D = 2\\rho A g$, also harmonisch.',
    'Die bewegte Masse ist die gesamte Flüssigkeit: $m = \\rho A L$.',
    '$T = 2\\pi\\sqrt{\\frac{L}{2g}}$, unabhängig von $\\rho$ und $A$.'],
  learn: 'U-Rohr-Nachweis: Säule $2s$ ⇒ $D = 2\\rho A g$, $m = \\rho A L$ ⇒ $T = 2\\pi\\sqrt{L/(2g)}$ (Mitschrift S. 8).' },

{ id: 'y10', area: 'systeme', afb: 2, type: 'mc',
  q: 'Warum hängt die Periodendauer eines Fadenpendels nicht von der Masse ab?',
  opts: [
    { t: R`Weil die Richtgröße $D = \frac{m g}{l}$ selbst proportional zu $m$ ist, $m$ kürzt sich in $T = 2\pi\sqrt{m/D}$ heraus.`, ok: true },
    { t: 'Weil der Faden die Masse trägt.' },
    { t: 'Weil schwere Körper weniger Luftreibung haben.' },
    { t: 'Weil die Gewichtskraft beim Schwingen keine Rolle spielt.' }],
  exp: R`Mehr Masse heißt mehr Trägheit, aber auch eine größere Rückstellkraft $m g\sin\alpha$. Beides gleicht sich genau aus: $T = 2\pi\sqrt{\frac{m}{m g/l}} = 2\pi\sqrt{\frac{l}{g}}$.`,
  learn: 'Fadenpendel: $D = \\frac{m g}{l}$, $T = 2\\pi\\sqrt{l/g}$.' }
);

const STEP = { 0.4: 0.2, 0.5: 0.25, 0.8: 0.2, 1.2: 0.4, 1.6: 0.4, 2: 0.5 };
const ticksTo = (max, step) => { const a = []; for (let x = step; x <= max + 1e-9; x += step) a.push(+x.toFixed(4)); return a; };
const mini2 = f => plot({ w: 220, h: 120, left: 18, right: 14, bottom: 14, xmin: 0, xmax: 2, ymin: -1.25, ymax: 1.25, xlabel: 't', curves: [{ f: x => Math.sin(2 * Math.PI * x), color: '--c-s', dash: '4 4', w: 1.6 }, { f, color: '--accent', w: 2.4 }], label: 'Kurvenvergleich' });
Q.push(
{ id: 'g1', area: 'diagramme', afb: 1, type: 'num', unit: 's', ask: 'T =',
  gen: r => ({ T: pick(r, [0.4, 0.5, 0.8, 1.2, 1.6, 2]), s: pick(r, [2, 3, 4, 5]) }),
  q: p => { const xmax = 2.5 * p.T, st = STEP[p.T], xt = ticksTo(xmax, st); return 'Lies aus dem s-t-Diagramm die Periodendauer ab.' + plot({ xmax, ymin: -p.s * 1.3, ymax: p.s * 1.3, xgrid: xt, ygrid: [p.s, -p.s], xticks: xt.map(x => [x, nf(x, 2)]), yticks: [[p.s, String(p.s)], [-p.s, String(-p.s)]], xlabel: 't in s', ylabel: 's in cm', curves: [{ f: x => p.s * Math.sin(2 * Math.PI * x / p.T), color: '--c-s' }], label: 's-t-Diagramm' }); },
  ans: p => p.T, tol: { rel: 0.04 },
  traps: p => [{ v: p.T / 2, tag: 'halbeT' }],
  exp: p => `Die Periodendauer ist der Abstand zweier gleicher Zustände, zum Beispiel vom ersten zum zweiten Hochpunkt (bei $\\frac{T}{4}$ und $\\frac{5T}{4}$) oder zwischen zwei Nulldurchgängen in gleicher Richtung. Hier $T = ${nf(p.T, 2)}\\,\\text{s}$.`,
  learn: '$T$ = Abstand zweier gleicher Zustände (Hochpunkt bis Hochpunkt), nicht Hoch- bis Tiefpunkt.' },

{ id: 'g2', area: 'diagramme', afb: 2, type: 'mc', grid: true,
  q: 'Die gestrichelte Kurve zeigt $s(t)$. Welche durchgezogene Kurve zeigt die zugehörige Geschwindigkeit $v(t)$?',
  opts: [
    { t: mini2(x => Math.cos(2 * Math.PI * x)), alt: 'Kosinuskurve, um T/4 vor s', ok: true },
    { t: mini2(x => -Math.cos(2 * Math.PI * x)), alt: 'negative Kosinuskurve, um T/4 hinter s', tag: 'SIGN' },
    { t: mini2(x => -Math.sin(2 * Math.PI * x)), alt: 'negative Sinuskurve, gegenphasig zu s', tag: 'VMAX' },
    { t: mini2(x => 0.97 * Math.sin(2 * Math.PI * x)), alt: 'dieselbe Kurve wie s' }],
  exp: '$v$ ist die Steigung von $s$: Wo $s$ am steilsten steigt (Nulldurchgang nach oben), ist $v$ maximal. Wo $s$ einen Hochpunkt hat, ist $v = 0$. Die v-Kurve eilt der s-Kurve um eine Viertelperiode voraus. Die gegenphasige Kurve wäre $a(t)$.',
  learn: '$v$-Kurve = Steigung der $s$-Kurve, um $T/4$ voraus. $a$-Kurve = gespiegelte $s$-Kurve.' },

{ id: 'g3', area: 'diagramme', afb: 2, type: 'num', unit: 'N/m', ask: 'D =',
  gen: r => ({ D: between(r, 10, 60, 5), sm: pick(r, [4, 5, 8, 10]) }),
  q: p => { const F = p.D * p.sm / 100; return 'Das Diagramm zeigt die Rückstellkraft eines Federpendels in Abhängigkeit von der Auslenkung. Bestimme die Richtgröße $D$.' + plot({ xmin: -p.sm * 1.15, xmax: p.sm * 1.15, ymin: -F * 1.3, ymax: F * 1.3, xgrid: [-p.sm, -p.sm / 2, p.sm / 2, p.sm], ygrid: [F, -F, F / 2, -F / 2], xticks: [[-p.sm, String(-p.sm)], [-p.sm / 2, nf(-p.sm / 2, 1)], [p.sm / 2, nf(p.sm / 2, 1)], [p.sm, String(p.sm)]], yticks: [[F, nf(F, 2)], [-F, nf(-F, 2)]], xlabel: 's in cm', ylabel: 'F in N', curves: [{ f: x => -p.D * x / 100, color: '--accent', x0: -p.sm * 1.1, x1: p.sm * 1.1 }], points: [[p.sm, -F], [-p.sm, F]], label: 'F-s-Diagramm' }); },
  ans: p => p.D, tol: { rel: 0.03 },
  exp: p => `Die Gerade hat die Steigung $-D$. Bei $s = ${p.sm}\\,\\text{cm} = ${nf(p.sm / 100, 2)}\\,\\text{m}$ ist $F = -${nf(p.D * p.sm / 100, 2)}\\,\\text{N}$, also $D = \\frac{${nf(p.D * p.sm / 100, 2)}\\,\\text{N}}{${nf(p.sm / 100, 2)}\\,\\text{m}} = ${p.D}\\,\\frac{\\text{N}}{\\text{m}}$. Achtung: cm in m umrechnen.`,
  learn: 'F-s-Diagramm: fallende Ursprungsgerade, $D = |\\Delta F/\\Delta s|$ mit $s$ in m.' },

{ id: 'g4', area: 'diagramme', afb: 2, type: 'mc', grid: true,
  q: 'Für $s(t) = \\sh\\sin(\\omega t)$ (gestrichelt) gesucht ist der Verlauf der kinetischen Energie $\\Ekin(t)$. Welcher Graph passt?',
  opts: [
    { t: mini2(x => Math.cos(2 * Math.PI * x) ** 2), alt: 'cos²-Kurve, startet maximal, nie negativ', ok: true },
    { t: mini2(x => Math.sin(2 * Math.PI * x) ** 2), alt: 'sin²-Kurve, startet bei null', tag: 'VMAX' },
    { t: mini2(x => Math.cos(2 * Math.PI * x)), alt: 'Kosinuskurve, wird negativ', tag: 'EPER' },
    { t: mini2(() => 0.8), alt: 'waagerechte Linie' }],
  exp: '$\\Ekin\\sim v^2\\sim\\cos^2(\\omega t)$: maximal, wenn $s = 0$ ist, null an den Umkehrpunkten, nie negativ, und zwei Maxima pro Periode. Die $\\sin^2$-Kurve gehört zur Elongationsenergie.',
  learn: '$\\Ekin\\sim\\cos^2$, $\\Eel\\sim\\sin^2$, beide mit Periode $T/2$, Summe konstant.' },

{ id: 'g5', area: 'diagramme', afb: 2, type: 'num', unit: 'm/s²', ask: 'g =',
  gen: r => { const l = pick(r, [0.35, 0.5, 0.6, 0.8, 1]); return { l, t: +(10 * 2 * Math.PI * Math.sqrt(l / G)).toFixed(2) }; },
  q: p => `Ein Fadenpendel der Länge ${nf(p.l, 2)} m braucht für 10 Schwingungen ${nf(p.t, 2)} s. Bestimme daraus den Ortsfaktor $g$.`,
  ans: p => 4 * Math.PI ** 2 * p.l / (p.t / 10) ** 2, tol: { rel: 0.02 },
  traps: p => [{ v: 4 * Math.PI ** 2 * p.l / p.t ** 2, tag: 'messung' }, { v: 4 * Math.PI ** 2 * p.l / (p.t / 10), tag: 'wurzel' }],
  exp: p => { const T = p.t / 10; return `$T = \\frac{${nf(p.t, 2)}\\,\\text{s}}{10} = ${nf(T, 3)}\\,\\text{s}$. Aus $T = 2\\pi\\sqrt{l/g}$ folgt $g = \\frac{4\\pi^2 l}{T^2} = \\frac{4\\pi^2\\cdot ${nf(p.l, 2)}\\,\\text{m}}{(${nf(T, 3)}\\,\\text{s})^2}\\approx ${sig(4 * Math.PI ** 2 * p.l / T ** 2, 3)}\\,\\frac{\\text{m}}{\\text{s}^2}$.`; },
  learn: 'Fadenpendel: $g = \\frac{4\\pi^2 l}{T^2}$. Viele Schwingungen messen und teilen.' },

{ id: 'g6', area: 'diagramme', afb: 2, type: 'mc', fixed: true,
  q: 'Trägt man gemessene Periodendauern über $\\sqrt{m/D}$ auf, erhält man eine Ursprungsgerade. Welche Steigung hat sie?',

{ id: 'g8', area: 'diagramme', afb: 1, type: 'mc',
  q: 'Wie bestimmt man die Periodendauer eines Pendels mit der Stoppuhr möglichst genau?',
  opts: [{ t: 'Die Zeit für viele Schwingungen (zum Beispiel 10) messen und durch deren Anzahl teilen.', ok: true }, { t: 'Eine einzelne Schwingung möglichst schnell stoppen.' }, { t: 'Eine halbe Schwingung stoppen und verdoppeln.' }, { t: 'Die Amplitude möglichst groß wählen.', tag: 'AMP' }],
  exp: 'Der Reaktionsfehler beim Starten und Stoppen ist fast gleich groß, egal wie lange man misst. Bei 10 Schwingungen verteilt er sich auf 10 Perioden und wird pro Periode zehnmal kleiner.',
  learn: '$T = \\frac{t_n}{n}$: viele Perioden messen verringert den Messfehler.' }
);
/* ---------- Zustand und Speicher ---------- */
const KEY_RUN = 'schwingcheck.run.v1', KEY_HIST = 'schwingcheck.hist.v1', KEY_LAST = 'schwingcheck.last.v1';
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ohne Speicher weiter */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* egal */ } }
};
const QBY = {};
let S = { view: 'home', run: null, draft: null, last: null, hist: [] };
const app = document.getElementById('app');
const IC = {};
function inst(q, run) { const k = run.seed + ':' + q.id; return IC[k] || (IC[k] = instance(q, run.seed)); }
const maxPts = q => q.pts || q.afb;

const MODES = {
  quick: { label: 'Schnelltest', n: 15, self: 1, mins: 'ca. 15 min', desc: '15 Aufgaben aus allen Bereichen. Gut für einen ersten Überblick.' },
  ka: { label: 'Klassenarbeit-Probe', n: 30, self: 2, mins: 'ca. 35 min', desc: '30 Aufgaben, gemischt wie in einer Klassenarbeit, mit Begründungsaufgaben.' },
  full: { label: 'Komplett-Check', n: 999, self: 99, mins: 'ca. 75 min', desc: 'Alle Aufgaben. Die genaueste Auswertung deiner Stärken und Lücken.' },
  weak: { label: 'Schwächen trainieren', n: 15, self: 2, mins: 'ca. 15 min', desc: 'Aufgaben aus deinen schwächsten Bereichen und die, die du falsch hattest.' },
  area: { label: 'Bereich üben', n: 999, self: 99, mins: '', desc: '' }
};
const NP = [[95, 15], [90, 14], [85, 13], [80, 12], [75, 11], [70, 10], [65, 9], [60, 8], [55, 7], [50, 6], [45, 5], [39, 4], [33, 3], [27, 2], [20, 1], [0, 0]];
const NOTE = ['6', '5−', '5', '5+', '4−', '4', '4+', '3−', '3', '3+', '2−', '2', '2+', '1−', '1', '1+'];
const points = pct => { for (const [t, np] of NP) if (pct >= t - 1e-9) return np; return 0; };
function status(pct) {
  if (pct >= 85) return { k: 'good', ico: '✓', lab: 'sicher' };
  if (pct >= 65) return { k: 'warning', ico: '◐', lab: 'festigen' };
  if (pct >= 45) return { k: 'serious', ico: '!', lab: 'Lücken' };
  return { k: 'critical', ico: '✕', lab: 'Grundlagen fehlen' };
}
const statusHTML = st => `<span class="status st-${st.k}"><span class="dot" aria-hidden="true">${st.ico}</span>${st.lab}</span>`;

/* ---------- Auswahl der Aufgaben ---------- */
function pickQuestions(mode, seed, opt = {}) {
  const r = mulberry32(seed);
  const M = MODES[mode];
  let pool = Q.slice(), prio = [];
  if (mode === 'area') pool = Q.filter(q => q.area === opt.area);
  if (mode === 'weak') {
    const last = S.hist[0];
    const weakAreas = last ? Object.entries(last.areas).filter(([, v]) => v < 85).sort((a, b) => a[1] - b[1]).slice(0, 3).map(([k]) => k) : [];
    prio = shuffle((last ? last.wrong : []).filter(id => QBY[id]), r).map(id => QBY[id]);
    pool = Q.filter(q => weakAreas.includes(q.area) && !prio.includes(q));
  }
  const out = []; let selfN = 0;
  const take = q => { if (out.includes(q)) return; if (q.type === 'self') { if (selfN >= M.self) return; selfN++; } out.push(q); };
  prio.forEach(q => { if (out.length < M.n) take(q); });
  const lists = shuffle(AREAS.map(a => shuffle(pool.filter(q => q.area === a.id), r)).filter(l => l.length), r);
  let guard = 0;
  while (out.length < M.n && lists.some(l => l.length) && guard++ < 5000) {
    for (const l of lists) { if (out.length >= M.n) break; const q = l.shift(); if (q) take(q); }
  }
  return shuffle(out, r).map(q => q.id);
}

function newRun(mode, opt = {}) {
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const qids = pickQuestions(mode, seed, opt);
  if (!qids.length) return;
  const label = mode === 'area' ? `Bereich: ${AREA[opt.area].name}` : MODES[mode].label;
  S.run = { mode, area: opt.area || null, label, qids, idx: 0, seed, answers: {}, started: Date.now(), finished: null };
  S.draft = null; S.view = 'quiz'; save(); render(true);
}

/* ---------- Auswertung ---------- */
function evaluate(run) {
  const areas = {}; AREAS.forEach(a => { areas[a.id] = { e: 0, p: 0, n: 0 }; });
  const afb = { 1: { e: 0, p: 0 }, 2: { e: 0, p: 0 }, 3: { e: 0, p: 0 } };
  const tags = {}, wrong = []; let e = 0, p = 0, n = 0;
  run.qids.forEach(id => {
    const q = QBY[id], A = run.answers[id]; if (!q || !A) return;
    const mx = maxPts(q), sc = A.f * mx;
    e += sc; p += mx; n++;
    areas[q.area].e += sc; areas[q.area].p += mx; areas[q.area].n++;
    afb[q.afb].e += sc; afb[q.afb].p += mx;
    if (A.f < 0.999) wrong.push(id);
    (A.tags || []).forEach(t => { tags[t] = (tags[t] || 0) + 1; });
  });
  return { e, p, n, pct: p ? e / p * 100 : 0, areas, afb, tags, wrong };
}

function finishRun() {
  const run = S.run; if (!run) return;
  run.finished = Date.now();
  const ev = evaluate(run);
  if (ev.n) {
    const areas = {}; Object.entries(ev.areas).forEach(([k, v]) => { if (v.p) areas[k] = Math.round(v.e / v.p * 100); });
    S.hist.unshift({ t: run.finished, label: run.label, pct: Math.round(ev.pct), np: points(ev.pct), n: ev.n, areas, wrong: ev.wrong });
    S.hist = S.hist.slice(0, 20); store.set(KEY_HIST, S.hist);
  }
  S.last = run; store.set(KEY_LAST, run); store.del(KEY_RUN);
  S.run = null; S.draft = null; S.view = 'result'; render(true);
}
function save() { if (S.run) store.set(KEY_RUN, { run: S.run, draft: S.draft }); }

/* ---------- Ansichten ---------- */
const WAVE = `<svg class="wave" viewBox="0 0 120 34" aria-hidden="true"><path d="M2 17 C 12 -3, 22 -3, 32 17 S 52 37, 62 17 S 82 -3, 92 17 S 112 37, 118 22"/><circle cx="32" cy="17" r="4"><animate attributeName="cx" values="2;118;2" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="17;17;17" dur="6s" repeatCount="indefinite"/></circle></svg>`;
function ago(t) { const d = Math.round((Date.now() - t) / 86400000); return d <= 0 ? 'heute' : d === 1 ? 'gestern' : `vor ${d} Tagen`; }

function renderHome() {
  const saved = S.run && !S.run.finished ? S.run : null;
  const last = S.hist[0];
  const count = id => Q.filter(q => q.area === id).length;
  let h = `<header class="brand"><div class="eyebrow">Physik · Oberstufe · Mechanische Schwingungen</div><div class="brand-line"><h1>Schwingungs-Check</h1>${WAVE}</div>
    <p class="lead">${Q.length} Aufgaben zu deiner Klassenarbeit, von Begriffen bis zur Energie. Am Ende siehst du, wo du stehst und was du für eine sehr gute Note noch lernen musst.</p></header><div class="stack">`;
  if (saved) {
    const done = Object.keys(saved.answers).length;
    h += `<div class="card resume row"><div style="min-width:0"><b>${esc(saved.label)}</b> läuft noch: ${done} von ${saved.qids.length} Aufgaben bearbeitet.</div><span class="spacer"></span><button type="button" class="btn" data-act="resume">Weitermachen</button><button type="button" class="btn quiet small" data-act="discard">Verwerfen</button></div>`;
  }
  if (last) {
    const st = status(last.pct);
    h += `<div class="card row"><div style="min-width:0"><div class="eyebrow">Letzter Test · ${ago(last.t)}</div><b>${esc(last.label)}:</b> ${last.pct} % · ${last.np} Notenpunkte (Note ${NOTE[last.np]}) ${statusHTML(st)}</div><span class="spacer"></span>${S.last ? '<button type="button" class="btn ghost small" data-act="showlast">Auswertung ansehen</button>' : ''}</div>`;
  }
  h += `</div><div class="section-title"><h2>Test starten</h2></div><div class="modes">`;
  ['ka', 'quick', 'full', 'weak'].forEach(m => {
    const M = MODES[m], off = m === 'weak' && !last;
    h += `<button type="button" class="mode${m === 'ka' ? ' primary' : ''}" data-act="start" data-mode="${m}"${off ? ' disabled style="opacity:.55;cursor:not-allowed"' : ''}><span class="mode-name">${M.label}</span><span class="mode-meta">${m === 'full' ? Q.length + ' Aufgaben · ' : ''}${M.mins}</span><span class="small">${off ? 'Erst nach deinem ersten Test verfügbar.' : M.desc}</span></button>`;
  });
  h += `</div><div class="section-title"><h2>Einen Bereich üben</h2></div><div class="areas">` +
    AREAS.map(a => { const v = last && last.areas[a.id] != null ? `${last.areas[a.id]} %` : `${count(a.id)} Aufg.`; return `<button type="button" class="area-btn" data-act="area" data-area="${a.id}"><span>${esc(a.name)}</span><span class="n">${v}</span></button>`; }).join('') + '</div>';
  h += `<div class="section-title"><h2>So wird ausgewertet</h2></div><div class="card stack">
    <p style="margin:0">Jede Aufgabe gehört zu einem Anforderungsbereich wie in der Klassenarbeit und bringt entsprechend viele Punkte:</p>
    <div class="afb-legend"><span class="chip afb">AFB I · 1 P.</span><span>Wissen wiedergeben: Begriffe, Formeln, Definitionen</span><span class="chip afb">AFB II · 2 P.</span><span>Anwenden: rechnen, Diagramme lesen, Kräfte bestimmen</span><span class="chip afb">AFB III · 3 P.</span><span>Begründen und übertragen: harmonische Schwingung nachweisen, neue Systeme</span></div>
    <p style="margin:0">Nach jeder Aufgabe bekommst du die Lösung mit Erklärung. Am Ende zeigt die Auswertung deine Punkte je Bereich, typische Denkfehler und einen Lernplan. Die Note ist ein Richtwert nach der üblichen Punktetabelle der Oberstufe (ab 85 % = 13 Punkte = sehr gut).</p>
    <p class="small muted" style="margin:0" data-ai="1" hidden>Bei Begründungsaufgaben kannst du deinen Text von Claude bewerten lassen, und jede Lösung lässt sich noch einmal anders erklären. Das nutzt dein Claude-Kontingent und passiert nur, wenn du auf den Knopf drückst.</p></div>`;
  if (S.hist.length) h += histTable();
  return h;
}

function histTable() {
  return `<div class="section-title"><h2>Dein Verlauf</h2></div><div class="card tbl-wrap"><table class="hist"><thead><tr><th>Wann</th><th>Test</th><th>Ergebnis</th><th>Punkte</th></tr></thead><tbody>` +
    S.hist.slice(0, 8).map(x => `<tr><td>${new Date(x.t).toLocaleDateString('de-DE')}</td><td>${esc(x.label)}</td><td class="num">${x.pct} %</td><td class="num">${x.np} (${NOTE[x.np]})</td></tr>`).join('') + '</tbody></table></div>';
}

function curQ() { return QBY[S.run.qids[S.run.idx]]; }
function renderQuiz() {
  const run = S.run, q = curQ(), I = inst(q, run), A = run.answers[q.id];
  if (!S.draft) S.draft = A ? JSON.parse(JSON.stringify(A.d)) : emptyDraft(q, I);
  const d = A ? A.d : S.draft;
  const total = run.qids.length, done = Object.keys(run.answers).length;
  const last = run.idx === total - 1;
  let h = `<div class="qtop"><div class="row"><span class="eyebrow">Aufgabe ${run.idx + 1} von ${total}</span><span class="small muted">· ${esc(run.label)}</span><span class="spacer"></span><button type="button" class="btn quiet small" data-act="pause">Pause</button></div><div class="progress" aria-hidden="true"><span style="width:${done / total * 100}%"></span></div></div>`;
  h += `<article class="card stack"><div class="chips"><span class="chip">${esc(AREA[q.area].name)}</span><span class="chip afb">AFB ${['', 'I', 'II', 'III'][q.afb]} ·${maxPts(q)} ${maxPts(q) === 1 ? 'Punkt' : 'Punkte'}</span></div>`;
  h += `<div class="qtext">${fmt(val(q.q, I.p))}</div>${renderInput(q, I, d, A)}${A ? feedbackHTML(q, I, A) : ''}</article>`;
  h += '<div class="navbar">';
  if (!A) {
    h += `<button type="button" class="btn" data-act="check" id="btn-check"${isReady(q, d) ? '' : ' disabled'}>${q.type === 'self' ? 'Bewertung speichern' : 'Prüfen'}</button><button type="button" class="btn quiet" data-act="skip">Überspringen</button>`;
  } else {
    h += `<button type="button" class="btn" data-act="next" id="btn-next">${last ? 'Zur Auswertung' : 'Weiter'}</button>`;
  }
  if (run.idx > 0) h += '<button type="button" class="btn quiet small" data-act="prev">Zurück</button>';
  h += '<span class="spacer"></span>';
  if (done > 0 && !last) h += '<button type="button" class="btn quiet small" data-act="finish">Jetzt auswerten</button>';
  h += '</div>';
  if (q.type === 'mc' || q.type === 'multi') h += '<p class="small muted" style="margin-top:10px">Tastatur: <span class="kbd">1</span>–<span class="kbd">' + I.opts.length + '</span> wählen, <span class="kbd">Enter</span> prüfen und weiter.</p>';
  return h;
}

function feedbackHTML(q, I, A) {
  const mx = maxPts(q), sc = A.f * mx;
  const kind = A.skip ? 'bad' : A.f >= 0.999 ? 'ok' : A.f > 0 ? 'part' : 'bad';
  const head = A.skip ? 'Übersprungen' : kind === 'ok' ? 'Richtig' : kind === 'part' ? `Teilweise richtig: ${nf(sc, 1)} von ${mx} Punkten` : 'Leider nicht richtig';
  let h = `<div class="fb ${kind}"><span class="ico" aria-hidden="true">${kind === 'ok' ? '✓' : kind === 'part' ? '~' : '✕'}</span><div style="min-width:0"><h4>${head}</h4>`;
  if (q.type === 'num' && kind !== 'ok') h += `<p>Richtig ist <b>${sig(q.ans(I.p), 3)} ${esc(q.unit || '')}</b>.</p>`;
  if (kind !== 'ok') (A.tags || []).forEach(t => { const m = MISC[t]; if (m) h += `<p class="trap"><b>Typischer Fehler: ${esc(m[0])}.</b> ${fmt(m[1])}</p>`; });
  if (q.exp) h += `<div>${fmt(val(q.exp, I.p))}</div>`;
  h += `<div class="learn"><b>Merken:</b> ${fmt(q.learn)}<br><span class="ref">${esc(AREA[q.area].ref)}</span></div>`;
  h += `<div class="row" style="margin-top:8px" data-ai="1" hidden><button type="button" class="btn quiet small" data-act="explain">Anders erklären lassen</button></div><div class="ai-box" data-ai-explain hidden></div></div></div>`;
  return h;
}

function renderResult(run) {
  const ev = evaluate(run);
  if (!ev.n) return `<div class="stack"><h2>Noch nichts ausgewertet</h2><p>Du hast in diesem Test noch keine Aufgabe beantwortet.</p><div class="row"><button type="button" class="btn" data-act="home">Zur Startseite</button></div></div>`;
  const pct = ev.pct, np = points(pct), st = status(pct);
  const mins = run.finished && run.started ? Math.max(1, Math.round((run.finished - run.started) / 60000)) : null;
  let h = `<header class="brand"><div class="eyebrow">Auswertung · ${esc(run.label)}</div><h1>Dein Stand</h1></header>`;
  h += `<div class="card hero-score"><div class="big">${nf(pct, 0)} %</div><div class="stack" style="gap:6px"><div class="grade-line"><b>${np} Notenpunkte</b> · Note ${NOTE[np]} ${statusHTML(st)}</div>`;
  h += pct >= 85 ? '<p style="margin:0">Das ist im sehr guten Bereich. Schau dir unten die letzten Lücken an, dann sitzt alles.</p>'
    : `<p style="margin:0">Für eine sehr gute Note (ab 85 %, 13 Punkte) fehlen dir noch <b>${nf(Math.ceil(85 - pct), 0)} Prozentpunkte</b>. Der Lernplan unten zeigt dir, wo du sie am schnellsten holst.</p>`;
  h += `<p class="small muted" style="margin:0">${nf(ev.e, 1)} von ${ev.p} Punkten · ${ev.n} Aufgaben${mins ? ` · ${mins} min` : ''}. Richtwert nach der üblichen Punktetabelle, deine Lehrkraft kann anders werten.${run.mode === 'quick' ? ' Im Schnelltest gibt es nur 1–2 Aufgaben pro Bereich, die Auswertung ist deshalb grob.' : ''}</p></div></div>`;

  const rows = AREAS.filter(a => ev.areas[a.id].p).map(a => ({ a, v: ev.areas[a.id], pct: ev.areas[a.id].e / ev.areas[a.id].p * 100 }));
  h += `<div class="section-title"><h2>Deine Bereiche</h2><span class="small muted">Linie bei 85 % = sehr gut</span></div><div class="card bars">` + rows.map(rw => barRow(rw.a.name, rw.pct, `${nf(rw.v.e, 1)} von ${rw.v.p} Punkten · ${rw.v.n} Aufgaben`)).join('') + '</div>';
  const AFBN = { 1: 'AFB I · Wiedergeben', 2: 'AFB II · Anwenden', 3: 'AFB III · Begründen & Transfer' };
  h += `<div class="section-title"><h2>Nach Anforderungsbereich</h2></div><div class="card bars">` + [1, 2, 3].filter(k => ev.afb[k].p).map(k => barRow(AFBN[k], ev.afb[k].e / ev.afb[k].p * 100, `${nf(ev.afb[k].e, 1)} von ${ev.afb[k].p} Punkten`)).join('') + '</div>';

  const tagList = Object.entries(ev.tags).filter(([t]) => MISC[t]).sort((a, b) => b[1] - a[1]);
  if (tagList.length) h += `<div class="section-title"><h2>Deine typischen Fehler</h2></div><div class="card misc-list">` + tagList.map(([t, c]) => `<div class="misc"><b>${esc(MISC[t][0])}</b>${c > 1 ? ` <span class="chip">${c}×</span>` : ''}<div>${fmt(MISC[t][1])}</div></div>`).join('') + '</div>';

  h += `<div class="section-title"><h2>Dein Lernplan</h2></div><div class="plan">${planHTML(run, ev, rows)}</div>`;
  h += `<div class="card stack" data-ai="1" hidden style="margin-top:12px"><div class="row"><div style="min-width:0"><b>Persönlicher Lernplan von Claude</b><div class="small muted">Claude schreibt dir aus deiner Auswertung einen Plan für die nächsten Tage.</div></div><span class="spacer"></span><button type="button" class="btn ghost small" data-act="aiplan">Lernplan schreiben lassen</button></div><div class="ai-box" data-ai-plan hidden></div></div>`;

  const wrong = run.qids.filter(id => run.answers[id] && run.answers[id].f < 0.999);
  if (wrong.length) {
    h += `<div class="section-title"><h2>Aufgaben zum Nacharbeiten</h2><span class="small muted">${wrong.length}</span></div><div class="stack" style="gap:8px">` + wrong.map(id => {
      const q = QBY[id], I = inst(q, run), A = run.answers[id];
      const kind = A.f > 0 ? '~' : '✕';
      return `<details class="rev"><summary><span class="mono">${kind}</span><span style="min-width:0">${esc(shortText(val(q.q, I.p)))}</span></summary><div><div class="qtext" style="font-size:16px">${fmt(val(q.q, I.p))}</div>` +
        `<div><b>Deine Antwort:</b> ${fmt(answerText(q, I, A.d))}</div>${q.type !== 'self' ? `<div><b>Richtig:</b> ${fmt(correctText(q, I))}</div>` : `<div class="model"><div class="eyebrow">Musterlösung</div>${fmt(q.model)}</div>`}` +
        `${q.exp ? `<div>${fmt(val(q.exp, I.p))}</div>` : ''}<div class="learn"><b>Merken:</b> ${fmt(q.learn)}<br><span class="ref">${esc(AREA[q.area].ref)}</span></div></div></details>`;
    }).join('') + '</div>';
  }
  h += `<div class="navbar" style="margin-top:22px">${S.hist.length && S.hist[0].wrong.length ? '<button type="button" class="btn" data-act="start" data-mode="weak">Schwächen trainieren</button>' : ''}<button type="button" class="btn ghost" data-act="start" data-mode="ka">Neuer Test</button><button type="button" class="btn quiet" data-act="home">Zur Startseite</button></div>`;
  if (S.hist.length > 1) h += histTable();
  return h;
}

function barRow(label, pct, detail) {
  const st = status(pct);
  return `<div class="bar-row" tabindex="0" aria-label="${esc(label)}: ${nf(pct, 0)} Prozent, ${st.lab}. ${esc(detail)}"><span class="lbl">${esc(label)}</span><span class="bar-track"><span class="bar-fill fill-${st.k}" style="width:${Math.max(1.5, Math.min(100, pct))}%"></span><span class="goal"></span></span><span class="val">${nf(pct, 0)} %</span>${statusHTML(st)}<span class="tip" role="tooltip">${esc(detail)}</span></div>`;
}

function planHTML(run, ev, rows) {
  const weak = rows.filter(r => r.pct < 85).sort((a, b) => a.pct - b.pct);
  let h = '';
  const afb3 = ev.afb[3].p ? ev.afb[3].e / ev.afb[3].p * 100 : null;
  if (!weak.length) {
    h += `<div class="card plan-item"><h3>Alles im grünen Bereich</h3><p style="margin:0">In jedem Bereich hast du mindestens 85 %. Wiederhole den Komplett-Check in zwei, drei Tagen, damit das Wissen bis zur Klassenarbeit hält, und schreib die Begründungen (Federpendel, U-Rohr) einmal ohne Hilfe auf.</p></div>`;
  }
  weak.forEach((r, k) => {
    const st = status(r.pct);
    const missed = [...new Set(run.qids.filter(id => QBY[id].area === r.a.id && run.answers[id] && run.answers[id].f < 0.999).map(id => QBY[id].learn))].slice(0, 4);
    h += `<div class="card plan-item"><div class="row"><h3>${k + 1}. ${esc(r.a.name)}</h3>${statusHTML(st)}<span class="spacer"></span><span class="val">${nf(r.pct, 0)} %</span></div>`;
    if (missed.length) h += `<div><b>Das ging bei dir schief:</b><ul>${missed.map(m => `<li>${fmt(m)}</li>`).join('')}</ul></div>`;
    h += `<div><b>Das solltest du sicher können:</b><ul>${r.a.tips.map(t => `<li>${fmt(t)}</li>`).join('')}</ul></div>`;
    h += `<div class="row"><span class="small muted mono">${esc(r.a.ref)}</span><span class="spacer"></span><button type="button" class="btn ghost small" data-act="area" data-area="${r.a.id}">Diesen Bereich üben</button></div></div>`;
  });
  if (afb3 != null && afb3 < 70) h += `<div class="card plan-item"><h3>Begründen üben</h3><p style="margin:0">Bei den Begründungs- und Transferaufgaben (AFB III) hast du ${nf(afb3, 0)} %. Für eine 1 brauchst du genau diese Aufgaben. Schreib den Nachweis für das Federpendel und das U-Rohr aus dem Kopf auf: Kräfte, $\\Fr = -D\\cdot s$, $D$ konstant, also harmonisch mit $T = 2\\pi\\sqrt{m/D}$. Vergleiche danach mit Lernzettel S. 1, Kasten 1.</p></div>`.replace(/\$([^$]+?)\$/g, (m, t) => tex(t));
  return h;
}

function render(top) {
  if (S.view === 'quiz' && S.run) app.innerHTML = renderQuiz();
  else if (S.view === 'result' && S.last) app.innerHTML = renderResult(S.last);
  else { S.view = 'home'; app.innerHTML = renderHome(); }
  refreshAI();
  if (top === true) window.scrollTo({ top: 0 });
  if (S.view === 'quiz') {
    const A = S.run.answers[curQ().id];
    const f = A ? document.getElementById('btn-next') : app.querySelector('input[data-act="num"], textarea[data-act="selftext"]');
    if (f && top !== 'keep') f.focus({ preventScroll: true });
  }
}

/* ---------- Ablauf ---------- */
function check(skip) {
  const run = S.run, q = curQ(), I = inst(q, run);
  if (!skip && !isReady(q, S.draft)) return;
  const g = skip ? { f: 0, tags: [] } : grade(q, I, S.draft);
  run.answers[q.id] = { d: JSON.parse(JSON.stringify(S.draft)), f: g.f, tags: g.tags || [], trap: g.trap || null, skip: !!skip };
  save(); render('keep');
  const fb = app.querySelector('.fb'); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const nb = document.getElementById('btn-next'); if (nb) nb.focus({ preventScroll: true });
}
function go(delta) {
  const run = S.run; const ni = run.idx + delta;
  if (ni >= run.qids.length) return finishRun();
  if (ni < 0) return;
  run.idx = ni; S.draft = null; save(); render(true);
}
function updateCheckBtn() { const b = document.getElementById('btn-check'); if (b) b.disabled = !isReady(curQ(), S.draft); }

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act;
  const inQuiz = S.view === 'quiz' && S.run;
  const q = inQuiz ? curQ() : null, d = S.draft;
  switch (act) {
    case 'start': if (t.dataset.mode === 'weak' && !S.hist.length) return; newRun(t.dataset.mode); break;
    case 'area': newRun('area', { area: t.dataset.area }); break;
    case 'resume': S.view = 'quiz'; render(true); break;
    case 'discard': store.del(KEY_RUN); S.run = null; S.draft = null; render(true); break;
    case 'showlast': S.view = 'result'; render(true); break;
    case 'home': S.view = 'home'; render(true); break;
    case 'pause': save(); S.view = 'home'; render(true); break;
    case 'finish': finishRun(); break;
    case 'check': check(false); break;
    case 'skip': check(true); break;
    case 'next': go(1); break;
    case 'prev': go(-1); break;
    case 'pick':
      if (q.type === 'mc') d.sel = +t.dataset.k;
      else { const k = +t.dataset.k; d.sel = d.sel.includes(k) ? d.sel.filter(x => x !== k) : d.sel.concat(k); }
      save(); render('keep'); { const el = document.getElementById(`opt-${q.id}-${t.dataset.k}`); if (el) el.focus({ preventScroll: true }); } break;
    case 'tf': d.v[+t.dataset.k] = t.dataset.v === 'true'; save(); render('keep'); { const el = document.getElementById(t.id); if (el) el.focus({ preventScroll: true }); } break;
    case 'up': case 'down': {
      const k = +t.dataset.k, j = act === 'up' ? k - 1 : k + 1;
      [d.v[k], d.v[j]] = [d.v[j], d.v[k]]; d.moved = true; save(); render('keep');
      const el = document.getElementById(`${act === 'up' ? 'up' : 'dn'}-${q.id}-${j}`); if (el && !el.disabled) el.focus({ preventScroll: true }); break;
    }
    case 'selfshow': d.shown = true; save(); render('keep'); break;
    case 'selfai': aiGrade(t); break;
    case 'explain': aiExplain(t); break;
    case 'aiplan': aiPlan(t); break;
  }
});
app.addEventListener('change', e => {
  const t = e.target; if (!S.draft || !t.dataset) return;
  if (t.dataset.act === 'cloze' || t.dataset.act === 'match') { S.draft.v[+t.dataset.k] = +t.value; save(); updateCheckBtn(); }
  if (t.dataset.act === 'tick') { S.draft.ticks[+t.dataset.k] = t.checked; save(); }
});
app.addEventListener('input', e => {
  const t = e.target; if (!S.draft) return;
  if (t.dataset.act === 'num') { S.draft.v = t.value; save(); updateCheckBtn(); }
  if (t.dataset.act === 'selftext') { S.draft.text = t.value; save(); }
});
app.addEventListener('submit', e => { e.preventDefault(); if (S.view === 'quiz' && S.run && !S.run.answers[curQ().id]) check(false); });
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || !S.run || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  const q = curQ(), I = inst(q, S.run), A = S.run.answers[q.id];
  if (/^[1-8]$/.test(e.key) && !A && (q.type === 'mc' || q.type === 'multi') && tag !== 'select') {
    const pos = +e.key - 1; if (pos >= I.order.length) return;
    const k = I.order[pos];
    if (q.type === 'mc') S.draft.sel = k; else S.draft.sel = S.draft.sel.includes(k) ? S.draft.sel.filter(x => x !== k) : S.draft.sel.concat(k);
    save(); render('keep'); e.preventDefault(); return;
  }
  if (e.key === 'Enter') {
    if (tag === 'button' && !t.classList.contains('opt')) return;
    if (tag === 'select') return;
    e.preventDefault();
    if (A) go(1); else if (isReady(q, S.draft)) check(false);
  }
});

/* ---------- Claude (optional, nur auf Knopfdruck) ---------- */
let AI = null, aiOff = false;
function refreshAI() { app.querySelectorAll('[data-ai]').forEach(el => { el.hidden = !(AI && !aiOff); }); }
function aiErr(e) {
  const c = e && e.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { aiOff = true; refreshAI(); return 'Claude ist hier nicht verfügbar. Nutze die Musterlösung und die Erklärung.'; }
  if (c === 'cancelled') return '';
  if (c === 'rate_limited') return 'Gerade zu viele Anfragen. Versuch es in ein paar Minuten noch einmal.';
  if (c === 'session_expired') return 'Bitte melde dich erneut bei Claude an.';
  if (c === 'refused') return 'Claude hat diese Anfrage abgelehnt.';
  if (c === 'invalid_json') return 'Die Bewertung kam unvollständig zurück. Versuch es noch einmal oder bewerte selbst.';
  return 'Das hat nicht geklappt. Versuch es noch einmal.';
}
const FORMAT = 'Antworte auf Deutsch in der du-Form. Formeln als einfacher Text mit Unicode (zum Beispiel T = 2π·√(m/D)), kein LaTeX. Erlaubt sind nur **fett** und Aufzählungen mit "- ".';

async function aiExplain(btn) {
  const q = curQ(), I = inst(q, S.run), A = S.run.answers[q.id]; if (!A || !AI) return;
  const box = app.querySelector('[data-ai-explain]'); box.hidden = false; btn.disabled = true;
  box.innerHTML = '<div class="ai-head">Claude erklärt</div><p class="muted" style="margin:0">Claude denkt nach …</p>';
  const prompt = `Du bist Nachhilfelehrer für Physik in der Oberstufe (Gymnasium). Thema: mechanische Schwingungen.\n\nAufgabe: ${plain(val(q.q, I.p))}\n\nAntwort des Schülers: ${plain(answerText(q, I, A.d))}\nRichtige Lösung: ${plain(correctText(q, I))}\nErklärung aus dem Quiz: ${plain(val(q.exp, I.p) || q.learn)}\n\nErkläre die Lösung noch einmal anders und anschaulich, mit einem Alltagsbild oder einem Schritt-für-Schritt-Weg. War die Antwort falsch, sag kurz, welcher Denkfehler wahrscheinlich dahintersteckt. Höchstens 150 Wörter. ${FORMAT}`;
  try {
    const { text } = await AI(prompt, { onText: ({ text }) => { box.innerHTML = '<div class="ai-head">Claude erklärt</div>' + mdLite(text); } });
    box.innerHTML = '<div class="ai-head">Claude erklärt</div>' + mdLite(text);
  } catch (e) { const m = aiErr(e); if (m) box.innerHTML = `<p class="muted" style="margin:0">${esc(m)}</p>`; else box.hidden = true; }
  finally { btn.disabled = false; }
}

async function aiGrade(btn) {
  const q = curQ(), I = inst(q, S.run), d = S.draft; if (!AI) return;
  const out = app.querySelector('[data-ai-out]'); out.hidden = false;
  if (d.text.trim().length < 40) { out.textContent = 'Schreib zuerst deine Begründung, mindestens zwei, drei Sätze.'; return; }
  btn.disabled = true; out.textContent = 'Claude liest deine Begründung …';
  const prompt = `Du bewertest die schriftliche Begründung eines Schülers (Physik, Oberstufe, mechanische Schwingungen) wie eine faire Lehrkraft in einer Klassenarbeit.\n\nAufgabe: ${plain(val(q.q, I.p))}\n\nMusterlösung: ${plain(q.model)}\n\nKriterien (jeweils erfüllt oder nicht; sinngemäß richtig genügt, die genaue Formulierung ist egal):\n${q.rubric.map((t, k) => `${k + 1}. ${plain(t)}`).join('\n')}\n\nAntwort des Schülers:\n"""\n${d.text.slice(0, 4000)}\n"""\n\nAntworte nur mit JSON in genau dieser Form: {"kriterien": [true, false, ...], "feedback": "..."}. Das Array hat genau ${q.rubric.length} Einträge in der Reihenfolge der Kriterien. "feedback": 2 bis 4 Sätze, was gut ist und was für volle Punkte fehlt. ${FORMAT}`;
  try {
    const res = await AI.json(prompt);
    const ks = Array.isArray(res && res.kriterien) ? res.kriterien : [];
    d.ticks = q.rubric.map((_, k) => ks[k] === true);
    d.ai = String((res && res.feedback) || 'Bewertung übernommen.').slice(0, 1500);
    d.shown = true; save(); render('keep');
  } catch (e) { const m = aiErr(e); out.textContent = m; out.hidden = !m; btn.disabled = false; }
}

async function aiPlan(btn) {
  const run = S.last; if (!run || !AI) return;
  const ev = evaluate(run), box = app.querySelector('[data-ai-plan]'); box.hidden = false; btn.disabled = true;
  box.innerHTML = '<div class="ai-head">Lernplan</div><p class="muted" style="margin:0">Claude denkt nach …</p>';
  const areaLines = AREAS.filter(a => ev.areas[a.id].p).map(a => `- ${a.name}: ${Math.round(ev.areas[a.id].e / ev.areas[a.id].p * 100)} %`).join('\n');
  const missed = [...new Set(ev.wrong.map(id => plain(QBY[id].learn)))].slice(0, 12).map(s => '- ' + s).join('\n');
  const tags = Object.keys(ev.tags).filter(t => MISC[t]).map(t => '- ' + MISC[t][0]).join('\n') || '- keine erkannt';
  const prompt = `Ein Schüler bereitet sich auf eine Physik-Klassenarbeit (Oberstufe) zu mechanischen Schwingungen vor und will eine sehr gute Note. Die Lehrkraft betont: harmonische Schwingung begründen und rechnerisch zeigen, T und D aus Größen berechnen, Abhängigkeiten und Energie verstehen.\n\nErgebnis im Quiz: ${Math.round(ev.pct)} % (${points(ev.pct)} Notenpunkte).\nBereiche:\n${areaLines}\n\nTypische Fehler:\n${tags}\n\nFalsch beantwortet (Lernhinweise):\n${missed || '- nichts'}\n\nSchreib einen konkreten Lernplan für die nächsten 3 Tage: pro Tag 2 bis 4 Aufgaben mit Zeitangabe, beginnend mit den schwächsten Bereichen. Nenne als Material den Lernzettel (Seite 1: Kästen 1 bis 6, Seite 2: Begriffe) und die Mitschrift (S. 1 Begriffe/Fadenpendel, S. 3 Kraftgesetz und Bewegungsgesetze, S. 4 Federpendel, S. 5 Differentialgleichung, S. 6 Bestätigungsversuch, S. 7 Sekundenpendel, S. 8 Flüssigkeitspendel, S. 9–10 Energie). Höchstens 220 Wörter. ${FORMAT}`;
  try {
    const { text } = await AI(prompt, { onText: ({ text }) => { box.innerHTML = '<div class="ai-head">Lernplan</div>' + mdLite(text); } });
    box.innerHTML = '<div class="ai-head">Lernplan</div>' + mdLite(text);
  } catch (e) { const m = aiErr(e); if (m) box.innerHTML = `<p class="muted" style="margin:0">${esc(m)}</p>`; else box.hidden = true; }
  finally { btn.disabled = false; }
}

/* ---------- Start ---------- */
function start(data) {
  Q.forEach(q => { QBY[q.id] = q; });
  S.hist = store.get(KEY_HIST) || [];
  S.last = store.get(KEY_LAST);
  const snap = data && data.run !== undefined ? data : store.get(KEY_RUN);
  if (snap && snap.run && snap.run.qids && snap.run.qids.every(id => QBY[id])) { S.run = snap.run; S.draft = snap.draft || null; }
  if (S.last && !(S.last.qids || []).every(id => QBY[id])) S.last = null;
  S.view = data && data.view && (data.view !== 'quiz' || S.run) ? data.view : 'home';
  render();
  try {
    const p = window.claude && window.claude.use && window.claude.use('sample');
    if (p && p.then) p.then(s => { if (s) { AI = s; refreshAI(); } }, () => {});
  } catch (e) { /* ohne Claude weiter */ }
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => ({ view: S.view, run: S.run, draft: S.draft })); } catch (e) { /* egal */ }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
