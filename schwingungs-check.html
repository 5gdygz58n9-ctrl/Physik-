<title>Schwingungs-Check</title>

<style>
/* Layout: eine Lernspalte auf Millimeterpapier; Kurvenfarben s/v/a wie in der Mitschrift (rot, grün, magenta). */
:root {
  --paper: #f3f5f9;
  --grid-minor: rgba(42, 75, 208, 0.045);
  --grid-major: rgba(42, 75, 208, 0.09);
  --card: #ffffff;
  --ink: #172033;
  --muted: #5b6578;
  --line: #d8dde8;
  --accent: #2a4bd0;
  --accent-ink: #ffffff;
  --accent-soft: #e8edfd;
  --c-s: #d0333e;
  --c-v: #1f8545;
  --c-a: #c22f86;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --ok-bg: #e7f6e9;
  --bad-bg: #fdecec;
  --part-bg: #fff4dc;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}

  :root:not([data-theme="light"]) {
    --paper: #0f131c; --grid-minor: rgba(143, 166, 255, 0.035); --grid-major: rgba(143, 166, 255, 0.07);
    --card: #171d2a; --ink: #e7eaf2; --muted: #9aa4b8; --line: #2b3345;
    --accent: #8fa6ff; --accent-ink: #0f131c; --accent-soft: #1f2a4a;
    --c-s: #ff6b74; --c-v: #5fd08a; --c-a: #f07cc2;
    --ok-bg: #15301d; --bad-bg: #3a1c1f; --part-bg: #372b12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f131c; --grid-minor: rgba(143, 166, 255, 0.035); --grid-major: rgba(143, 166, 255, 0.07);
  --card: #171d2a; --ink: #e7eaf2; --muted: #9aa4b8; --line: #2b3345;
  --accent: #8fa6ff; --accent-ink: #0f131c; --accent-soft: #1f2a4a;
  --c-s: #ff6b74; --c-v: #5fd08a; --c-a: #f07cc2;
  --ok-bg: #15301d; --bad-bg: #3a1c1f; --part-bg: #372b12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid-minor) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16.5px;
  line-height: 1.55;
}
.wrap {
  max-width: 780px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 70px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(32px, 7vw, 48px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: clamp(22px, 4vw, 27px); font-weight: 800; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0 0 10px; }
a { color: var(--accent); }
b, strong { font-weight: 700; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }

/* Kopf */
.brand { display: grid; gap: 6px; margin-bottom: 18px; }
.brand-line { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.wave { width: 120px; height: 34px; flex: none; }
.wave path { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
.wave circle { fill: var(--c-s); }
.lead { font-size: 18px; color: var(--muted); max-width: 60ch; }

/* Flächen */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card.flat { background: transparent; border-style: dashed; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 400; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }

/* Startseite */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; display: grid; gap: 6px; min-width: 0; }
.mode:hover { border-color: var(--accent); }
.mode .mode-name { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.mode .mode-meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.mode.primary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.area-btn { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; min-width: 0; }
.area-btn:hover { border-color: var(--accent); }
.area-btn .n { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.afb-legend { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 15px; }
.resume { border-color: var(--accent); background: var(--accent-soft); }

/* Quiz */
.qtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px 8px; margin-bottom: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted); background: var(--card); white-space: nowrap; }
.chip.afb { border-color: var(--accent); color: var(--accent); }
.qtext { font-size: 18px; line-height: 1.55; }
.qtext p:last-child { margin-bottom: 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .key { font-family: var(--font-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--ok-bg); }
.opt.wrong { border-color: var(--critical); background: var(--bad-bg); }
.opt.missed { border-color: var(--good); border-style: dashed; }
.opt:disabled { cursor: default; }
.opt-body { min-width: 0; overflow-wrap: anywhere; }
.opt svg { width: 100%; max-width: 260px; height: auto; display: block; }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.num-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.num-row input { font: inherit; font-family: var(--font-mono); font-size: 18px; width: 11em; max-width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); }
.num-row input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.num-row .unit { font-family: var(--font-mono); color: var(--muted); }
.num-row input.right { border-color: var(--good); background: var(--ok-bg); }
.num-row input.wrong { border-color: var(--critical); background: var(--bad-bg); }
select { font: inherit; font-size: 15.5px; padding: 5px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); max-width: 100%; }
select.right { border-color: var(--good); background: var(--ok-bg); }
select.wrong { border-color: var(--critical); background: var(--bad-bg); }
.cloze { line-height: 2.3; font-size: 17px; }
.match-row, .tf-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tf-row { grid-template-columns: minmax(0, 1fr) auto; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { background: var(--card); border: 0; padding: 7px 12px; cursor: pointer; min-height: 38px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button.right { background: var(--ok-bg); box-shadow: inset 0 0 0 2px var(--good); color: var(--ink); }
.seg button.wrong { background: var(--bad-bg); box-shadow: inset 0 0 0 2px var(--critical); color: var(--ink); }
.order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.order-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.order-list li .pos { font-family: var(--font-mono); color: var(--muted); }
.order-list li.right { border-color: var(--good); background: var(--ok-bg); }
.order-list li.wrong { border-color: var(--critical); background: var(--bad-bg); }
.order-list .mv { display: flex; gap: 4px; }
.order-list .mv button { width: 36px; height: 36px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
textarea { font: inherit; width: 100%; min-height: 150px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); resize: vertical; }
.rubric { display: grid; gap: 6px; }
.rubric label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.rubric label:hover { background: var(--accent-soft); }
.rubric input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.model { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }

.fb { border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.fb .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
.fb.ok { background: var(--ok-bg); } .fb.ok .ico { background: var(--good); }
.fb.bad { background: var(--bad-bg); } .fb.bad .ico { background: var(--critical); }
.fb.part { background: var(--part-bg); } .fb.part .ico { background: var(--warning); color: #0b0b0b; }
.fb h4 { margin: 0 0 4px; font-size: 16px; }
.learn { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 15px; }
.learn .ref { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.trap { margin-top: 6px; font-size: 15px; }
.ai-box { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); font-size: 15.5px; white-space: normal; }
.ai-box .ai-head { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .05em; text-transform: uppercase; }
.navbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }

/* Auswertung */
.hero-score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 12vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
.grade-line { font-size: 18px; }
.bars { display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 13em) minmax(60px, 1fr) 3.4em minmax(0, 9.5em); gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); position: relative; }
.bar-row .lbl { min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.bar-track { height: 14px; position: relative; border-left: 1px solid var(--muted); }
.bar-track .goal { position: absolute; top: -4px; bottom: -4px; left: 85%; border-left: 1px dashed var(--muted); }
.bar-fill { position: absolute; left: 0; top: 1px; bottom: 1px; border-radius: 0 4px 4px 0; max-width: 100%; }
.val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 14.5px; }
.status { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; white-space: nowrap; }
.status .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.st-good .dot, .fill-good { background: var(--good); }
.st-warning .dot, .fill-warning { background: var(--warning); }
.st-warning .dot { color: #0b0b0b; }
.st-serious .dot, .fill-serious { background: var(--serious); }
.st-critical .dot, .fill-critical { background: var(--critical); }
.tip { position: absolute; z-index: 20; left: 30%; top: 100%; background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 9px; border-radius: 7px; pointer-events: none; white-space: nowrap; display: none; }
.bar-row:hover .tip, .bar-row:focus .tip { display: block; }
.plan { display: grid; gap: 12px; }
.plan-item { display: grid; gap: 6px; }
.plan-item ul { margin: 0; padding-left: 20px; }
.plan-item li { margin-bottom: 3px; }
.misc-list { display: grid; gap: 8px; }
.misc { border-left: 3px solid var(--serious); padding: 2px 0 2px 12px; }
details.rev { border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
details.rev summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.rev summary::-webkit-details-marker { display: none; }
details.rev > div { padding: 0 14px 14px; display: grid; gap: 8px; }
table.hist { border-collapse: collapse; width: 100%; font-size: 15px; }
table.hist th, table.hist td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.hist th { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
table.hist td.num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.tbl-wrap { overflow-x: auto; }

/* Formeln */
.m { white-space: nowrap; font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 1.06em; }
.m i { font-style: italic; }
.m .tx, .m .fn, .m .up { font-style: normal; font-family: var(--font-body); font-size: .94em; }
.m .op { padding: 0 .16em; }
.m .op.un { padding: 0 .04em 0 0; }
.m sub, .m sup { font-size: .7em; line-height: 0; }
.m sub .tx, .m sup .tx { font-size: 1em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .88em; line-height: 1.12; margin: 0 .08em; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .2em .06em; }
.fr > span:last-child { padding: .06em .2em 0; }
.sq { white-space: nowrap; }
.sq > .rad { display: inline-block; font-family: "Times New Roman", serif; font-style: normal; }
.sq.tall > .rad { transform: scale(1, 1.75); transform-origin: 50% 70%; margin-right: .02em; }
.sq > .rb { border-top: 1.2px solid currentColor; padding: .02em .1em 0 .06em; display: inline-block; line-height: 1.12; }
.hat { position: relative; display: inline-block; }
.hat::before { content: "\02C6"; position: absolute; left: 50%; top: -.42em; transform: translateX(-42%); font-style: normal; font-size: .95em; }
.dm { display: block; text-align: center; margin: 8px 0; overflow-x: auto; white-space: nowrap; }
.fig { width: 100%; height: auto; display: block; max-width: 520px; }
.fig text { font-family: var(--font-body); }

@media (max-width: 640px) {
  .modes, .opt-grid { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: minmax(0, 1fr) 3.2em; grid-template-areas: "l v" "b b" "s s"; row-gap: 4px; }
  .bar-row .lbl { grid-area: l; } .bar-row .val { grid-area: v; } .bar-row .bar-track { grid-area: b; } .bar-row .status { grid-area: s; }
  .hero-score { grid-template-columns: minmax(0, 1fr); }
  .match-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .qtext { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<script>
/* ---------- Grundwerkzeuge ---------- */
const G = 9.81;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngFor(seed, key) { return mulberry32((seed ^ hashStr(key)) >>> 0); }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function between(r, lo, hi, step) { const n = Math.round((hi - lo) / step); return +(lo + step * Math.floor(r() * (n + 1))).toFixed(6); }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* Zahlen deutsch formatieren */
function nf(x, d = 2) {
  if (!isFinite(x)) return '–';
  return Number(x).toLocaleString('de-DE', { maximumFractionDigits: d, useGrouping: false });
}
function sig(x, n = 3) {
  if (!isFinite(x)) return '–';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const d = Math.max(0, n - 1 - e);
  return nf(Number(x.toFixed(Math.min(d, 12))), d);
}
function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/\s+/g, '').replace(/[−–]/g, '-');
  s = s.replace(/[·*x×]10\^?/i, 'e').replace(',', '.');
  const m = s.match(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
  return m ? parseFloat(m[0]) : NaN;
}

/* ---------- Mini-Formelsatz ($...$ im Text) ---------- */
const MACROS = {
  Fres: 'F_{\\text{res}}', Fr: 'F_{\\text{Rück}}', FG: 'F_{G}', FF: 'F_{F}', Fz: 'F_{\\text{zug}}',
  Ekin: 'E_{\\text{kin}}', Eel: 'E_{\\text{Elong}}', Eges: 'E_{\\text{ges}}',
  sh: '\\hat{s}', vh: '\\hat{v}', ah: '\\hat{a}'
};
function expandMacros(s) { return s.replace(/\\(Fres|Fr|FG|FF|Fz|Ekin|Eel|Eges|sh|vh|ah)(?![a-zA-Z])/g, (m, n) => MACROS[n]); }
const GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', Delta: 'Δ', varphi: 'φ', phi: 'ϕ', omega: 'ω', pi: 'π', rho: 'ρ', lambda: 'λ', mu: 'μ', theta: 'θ', tau: 'τ', sigma: 'σ', Omega: 'Ω' };

  function rawArg() {

      else name = src[i++] || '';

      if (name === 'sqrt') { const a = arg(); operand = true; return `<span class="sq${a.includes('class="fr"') ? ' tall' : ''}"><span class="rad">√</span><span class="rb">${a}</span></span>`; }

function fmt(s) {
  if (s == null) return '';

    .replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => `<span class="dm">${tex(t)}</span>`)
    .replace(/\$([^$]+?)\$/g, (m, t) => tex(t));

/* Kurzfassung ohne Formelbefehle, z. B. für zugeklappte Listen */
function shortText(s, n = 90) {
  let t = plain(s).replace(/<svg[\s\S]*?<\/svg>/g, '');
  for (let k = 0; k < 3; k++) {
    t = t.replace(/\\t?frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2').replace(/\\sqrt\{([^{}]*)\}/g, '√($1)')
      .replace(/\\(?:text|mathrm)\{([^{}]*)\}/g, '$1').replace(/\\hat\{?([a-z])\}?/g, (m, c) => PRE_HAT[c] || c);
  }
  t = t.replace(/\\([a-zA-Z]+)/g, (m, w) => GREEK[w] || SYMS[w] || (['sin', 'cos', 'tan'].includes(w) ? w : ''))
    .replace(/\\[,;! ]/g, ' ').replace(/[{}$]/g, '').replace(/\^2/g, '²').replace(/_([A-Za-z0-9]+)/g, '$1').replace(/\s+/g, ' ').trim();

/* Text für Claude: TeX bleibt lesbar, HTML fällt weg */
function plain(s) { return expandMacros(String(s || '')).replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim(); }

/* ---------- Diagramme ---------- */
function plot(o) {
  const W = o.w || 520, H = o.h || 230, L = o.left ?? 50, R = o.right ?? 18, T = 22, B = o.bottom ?? 30;
  const xmin = o.xmin ?? 0, xmax = o.xmax, ymin = o.ymin, ymax = o.ymax;
  const X = x => L + (x - xmin) / (xmax - xmin) * (W - L - R);
  const Y = y => T + (ymax - y) / (ymax - ymin) * (H - T - B);
  let s = `<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Diagramm')}">`;
  (o.xgrid || []).forEach(x => { s += `<line x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H - B}" style="stroke:var(--line)" stroke-width="1"/>`; });
  (o.ygrid || []).forEach(y => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width="1"/>`; });
  const y0 = (ymin <= 0 && ymax >= 0) ? Y(0) : H - B;
  s += `<line x1="${L}" x2="${W - R + 6}" y1="${y0}" y2="${y0}" style="stroke:var(--muted)" stroke-width="1.3"/>`;
  s += `<polygon points="${W - R + 10},${y0} ${W - R + 2},${y0 - 4} ${W - R + 2},${y0 + 4}" style="fill:var(--muted)"/>`;
  const xa = (xmin < 0 && xmax > 0) ? X(0) : L;
  s += `<line x1="${xa}" x2="${xa}" y1="${T - 8}" y2="${H - B}" style="stroke:var(--muted)" stroke-width="1.3"/>`;
  s += `<polygon points="${xa},${T - 12} ${xa - 4},${T - 4} ${xa + 4},${T - 4}" style="fill:var(--muted)"/>`;
  const xty = o.xTicksBottom ? H - B + 16 : y0 + 15;
  (o.xticks || []).forEach(([x, lab]) => { s += `<text x="${X(x)}" y="${xty}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${lab}</text>`; });
  (o.yticks || []).forEach(([y, lab]) => { s += `<text x="${xa - 6}" y="${Y(y) + 4}" text-anchor="end" font-size="12" style="fill:var(--muted)">${lab}</text>`; });
  if (o.xlabel) s += `<text x="${W - R}" y="${y0 - 7}" text-anchor="end" font-size="12.5" style="fill:var(--ink)">${o.xlabel}</text>`;
  if (o.ylabel) s += `<text x="${xa + 8}" y="${T - 6}" font-size="12.5" style="fill:var(--ink)">${o.ylabel}</text>`;
  (o.curves || []).forEach(c => {
    const n = c.n || 260, a = c.x0 ?? xmin, b = c.x1 ?? xmax; let d = '';
    for (let k = 0; k <= n; k++) { const x = a + (b - a) * k / n; d += (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(c.f(x)).toFixed(1); }
    s += `<path d="${d}" fill="none" style="stroke:var(${c.color || '--accent'})" stroke-width="${c.w || 2.2}"${c.dash ? ` stroke-dasharray="${c.dash}"` : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  (o.points || []).forEach(p => { s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" style="fill:var(${p[2] || '--accent'});stroke:var(--card)" stroke-width="2"/>`; });
  (o.texts || []).forEach(t => { s += `<text x="${X(t[0])}" y="${Y(t[1])}" font-size="13" ${t[3] ? `text-anchor="${t[3]}"` : ''} style="fill:var(--ink)"${t[4] ? ' font-style="italic"' : ''}>${t[2]}</text>`; });
  return s + '</svg>';
}

const Q = [];
/* ---------- Aufgabentypen ---------- */
const val = (x, p) => typeof x === 'function' ? x(p) : x;
const KEYS = 'ABCDEFGH';

/* Instanz einer Aufgabe: Zahlenwerte und Reihenfolgen hängen nur vom Seed ab */
function instance(q, seed) {
  const r = rngFor(seed, q.id);
  const p = q.gen ? q.gen(r) : {};
  const I = { p };
  if (q.type === 'mc' || q.type === 'multi') { I.opts = val(q.opts, p); I.order = q.fixed ? I.opts.map((_, k) => k) : shuffle(I.opts.map((_, k) => k), r); }
  if (q.type === 'cloze') I.bo = q.blanks.map(b => shuffle(b.o.map((_, k) => k), r));
  if (q.type === 'match') I.ro = shuffle(q.pairs.map((_, k) => k), r);
  if (q.type === 'order') {
    let o = shuffle(q.items.map((_, k) => k), r);
    if (o.every((v, k) => v === k)) o = o.slice(1).concat(o[0]);
    I.start = o;
  }
  return I;
}

function emptyDraft(q, I) {
  switch (q.type) {
    case 'mc': return { sel: null };
    case 'multi': return { sel: [] };
    case 'tf': return { v: q.items.map(() => null) };
    case 'cloze': return { v: q.blanks.map(() => -1) };
    case 'match': return { v: q.pairs.map(() => -1) };
    case 'order': return { v: I.start.slice(), moved: false };
    case 'num': return { v: '' };
    case 'self': return { text: '', shown: false, ticks: q.rubric.map(() => false), ai: null };
  }
  return {};
}

function isReady(q, d) {
  switch (q.type) {
    case 'mc': return d.sel != null;
    case 'multi': return d.sel.length > 0;
    case 'tf': return d.v.every(x => x !== null);
    case 'cloze': case 'match': return d.v.every(x => x >= 0);
    case 'order': return true;
    case 'num': return d.v.trim() !== '' && isFinite(parseNum(d.v));
    case 'self': return d.shown;
  }
  return false;
}

function renderInput(q, I, d, A) {
  const dis = A ? ' disabled' : '';
  if (q.type === 'mc' || q.type === 'multi') {
    const multi = q.type === 'multi';
    return `<div class="opts${q.grid ? ' opt-grid' : ''}" role="${multi ? 'group' : 'radiogroup'}">` + I.order.map((k, pos) => {
      const o = I.opts[k]; const on = multi ? d.sel.includes(k) : d.sel === k;
      let cls = on ? 'sel' : '';
      if (A) cls = o.ok ? (on ? 'right' : 'missed') : (on ? 'wrong' : '');
      return `<button type="button" id="opt-${q.id}-${k}" class="opt ${cls}" data-act="pick" data-k="${k}" aria-pressed="${on}"${dis}><span class="key">${KEYS[pos]}</span><span class="opt-body">${fmt(o.t)}</span></button>`;
    }).join('') + '</div>' + (multi ? '<p class="small muted" style="margin-top:6px">Mehrere Antworten können richtig sein.</p>' : '');
  }
  if (q.type === 'tf') {
    return '<div>' + q.items.map((it, k) => {
      const b = (v, lab) => {
        let cls = d.v[k] === v ? 'on' : '';
        if (A) cls = d.v[k] === v ? (it.v === v ? 'right' : 'wrong') : '';
        return `<button type="button" id="tf-${q.id}-${k}-${v}" class="${cls}" data-act="tf" data-k="${k}" data-v="${v}"${dis}>${lab}</button>`;
      };
      return `<div class="tf-row"><div>${fmt(it.t)}</div><div class="seg">${b(true, 'wahr')}${b(false, 'falsch')}</div></div>`;
    }).join('') + '</div>';
  }
  if (q.type === 'cloze') {
    return '<div class="cloze">' + fmt(q.text).replace(/\[\[(\d+)\]\]/g, (m, kk) => {
      const k = +kk, b = q.blanks[k];
      const cls = A ? (d.v[k] === b.a ? 'right' : 'wrong') : '';
      return `<select id="cl-${q.id}-${k}" class="${cls}" data-act="cloze" data-k="${k}" aria-label="Lücke ${k + 1}"${dis}><option value="-1">auswählen …</option>` +
        I.bo[k].map(oi => `<option value="${oi}"${d.v[k] === oi ? ' selected' : ''}>${esc(b.o[oi])}</option>`).join('') + '</select>';
    }) + '</div>';
  }
  if (q.type === 'match') {
    return '<div>' + q.pairs.map((pr, k) => {
      const cls = A ? (d.v[k] === k ? 'right' : 'wrong') : '';
      return `<div class="match-row"><div><b>${fmt(pr.l)}</b></div><select id="ma-${q.id}-${k}" class="${cls}" data-act="match" data-k="${k}" aria-label="Zuordnung für Begriff ${k + 1}"${dis}><option value="-1">zuordnen …</option>` +
        I.ro.map(ri => `<option value="${ri}"${d.v[k] === ri ? ' selected' : ''}>${esc(q.pairs[ri].r)}</option>`).join('') + '</select></div>';
    }).join('') + '</div>';
  }
  if (q.type === 'order') {
    return '<ol class="order-list">' + d.v.map((it, pos) => {
      const cls = A ? (it === pos ? 'right' : 'wrong') : '';
      return `<li class="${cls}"><span class="pos">${pos + 1}.</span><span>${fmt(q.items[it])}</span>` +
        (A ? '<span></span>' : `<span class="mv"><button type="button" id="up-${q.id}-${pos}" data-act="up" data-k="${pos}" aria-label="nach oben"${pos === 0 ? ' disabled' : ''}>↑</button><button type="button" id="dn-${q.id}-${pos}" data-act="down" data-k="${pos}" aria-label="nach unten"${pos === d.v.length - 1 ? ' disabled' : ''}>↓</button></span>`) + '</li>';
    }).join('') + '</ol>';
  }
  if (q.type === 'num') {
    const cls = A ? (A.f >= 0.999 ? 'right' : 'wrong') : '';
    return `<form class="num-row" data-form="num" autocomplete="off"><label for="num-${q.id}" class="small muted">${esc(q.ask || 'Ergebnis')}</label><input id="num-${q.id}" class="${cls}" inputmode="decimal" placeholder="z. B. 0,25" value="${esc(d.v)}" data-act="num"${dis}><span class="unit">${esc(q.unit || '')}</span></form>` +
      '<p class="small muted" style="margin-top:6px">Komma oder Punkt, ohne Einheit. Auf etwa 3 gültige Ziffern runden.</p>';
  }
  if (q.type === 'self') {
    let h = `<textarea id="self-${q.id}" data-act="selftext" placeholder="Schreib deine Begründung hier hin, so wie in der Klassenarbeit …"${d.shown ? ' readonly' : ''}>${esc(d.text)}</textarea>`;
    if (!d.shown) {
      h += `<div class="row" style="margin-top:8px"><button type="button" class="btn ghost small" data-act="selfshow">Musterlösung zeigen und selbst bewerten</button>` +
        `<button type="button" class="btn small" data-act="selfai" data-ai="1" hidden>Von Claude bewerten lassen</button></div><div class="ai-box" data-ai-out hidden></div>`;
    } else {
      h += `<div class="stack" style="margin-top:12px"><div class="model"><div class="eyebrow">Musterlösung</div>${fmt(q.model)}</div>` +
        (d.ai ? `<div class="ai-box"><div class="ai-head">Bewertung von Claude</div>${mdLite(d.ai)}</div>` : '') +
        `<div><div class="eyebrow" style="margin-bottom:4px">${A ? 'Deine Bewertung' : 'Was davon steht (sinngemäß) in deiner Begründung? Ehrlich ankreuzen:'}</div><div class="rubric">` +
        q.rubric.map((t, k) => `<label for="rb-${q.id}-${k}"><input type="checkbox" id="rb-${q.id}-${k}" data-act="tick" data-k="${k}"${d.ticks[k] ? ' checked' : ''}${dis}><span>${fmt(t)}</span></label>`).join('') + '</div></div></div>';
    }
    return h;
  }
  return '';
}

/* Bewertung: f = Anteil der Punkte (0..1), tags = erkannte Denkfehler */
function grade(q, I, d) {
  const p = I.p;
  switch (q.type) {
    case 'mc': { const o = I.opts[d.sel]; return o && o.ok ? { f: 1, tags: [] } : { f: 0, tags: o && o.tag ? [o.tag] : [] }; }
    case 'multi': {
      const okN = I.opts.filter(o => o.ok).length;
      const good = d.sel.filter(k => I.opts[k].ok).length, bad = d.sel.filter(k => !I.opts[k].ok);
      const f = Math.max(0, (good - bad.length) / okN);
      return { f: (good === okN && !bad.length) ? 1 : Math.min(f, 0.99), tags: bad.map(k => I.opts[k].tag).filter(Boolean) };
    }
    case 'tf': { let c = 0; const tags = []; q.items.forEach((it, k) => { if (d.v[k] === it.v) c++; else if (it.tag) tags.push(it.tag); }); return { f: c / q.items.length, tags }; }
    case 'cloze': { const c = q.blanks.filter((b, k) => d.v[k] === b.a).length; return { f: c / q.blanks.length, tags: c < q.blanks.length && q.tag ? [q.tag] : [] }; }
    case 'match': { const c = q.pairs.filter((_, k) => d.v[k] === k).length; return { f: c / q.pairs.length, tags: [] }; }
    case 'order': { const c = d.v.filter((it, pos) => it === pos).length; return { f: c / d.v.length, tags: [] }; }
    case 'num': {
      const x = parseNum(d.v), a = q.ans(p), tol = val(q.tol, p) || {};
      const near = (u, v) => tol.abs != null ? Math.abs(u - v) <= tol.abs : Math.abs(u - v) <= Math.abs(v) * (tol.rel || 0.02) + 1e-12;
      if (near(x, a)) return { f: 1, tags: [] };
      const traps = q.traps ? q.traps(p) : [];
      for (const t of traps) if (isFinite(t.v) && near(x, t.v)) return { f: 0, tags: [t.tag], trap: t.tag };
      if (a !== 0) {
        const ratio = Math.abs(x / a);
        for (const k of [10, 100, 1000, 10000, 1e6]) if (Math.abs(ratio * k - 1) < 0.03 || Math.abs(ratio / k - 1) < 0.03) return { f: 0, tags: ['einheit'], trap: 'einheit' };
        if (Math.abs(x + a) <= Math.abs(a) * 0.03) return { f: 0, tags: ['vorzeichen'], trap: 'vorzeichen' };
      }
      return { f: 0, tags: [] };
    }
    case 'self': return { f: d.ticks.filter(Boolean).length / q.rubric.length, tags: [] };
  }
  return { f: 0, tags: [] };
}

function answerText(q, I, d) {
  switch (q.type) {
    case 'mc': return d.sel == null ? '–' : (I.opts[d.sel].alt || I.opts[d.sel].t);
    case 'multi': return d.sel.length ? d.sel.map(k => I.opts[k].alt || I.opts[k].t).join(' · ') : '–';
    case 'tf': return q.items.map((it, k) => (d.v[k] === null ? '–' : d.v[k] ? 'wahr' : 'falsch')).join(', ');
    case 'cloze': return q.blanks.map((b, k) => d.v[k] >= 0 ? b.o[d.v[k]] : '–').join(' | ');
    case 'match': return q.pairs.map((pr, k) => `${pr.l} → ${d.v[k] >= 0 ? q.pairs[d.v[k]].r : '–'}`).join('; ');
    case 'order': return d.v.map(k => q.items[k]).join(' → ');
    case 'num': return d.v ? `${esc(d.v)} ${q.unit || ''}` : '–';
    case 'self': return d.text ? esc(d.text) : '(nichts geschrieben)';
  }
  return '';
}

function correctText(q, I) {
  const p = I.p;
  switch (q.type) {
    case 'mc': case 'multi': return I.opts.filter(o => o.ok).map(o => o.alt || o.t).join(' · ');
    case 'tf': return q.items.map(it => it.v ? 'wahr' : 'falsch').join(', ');
    case 'cloze': return q.blanks.map(b => b.o[b.a]).join(' | ');
    case 'match': return q.pairs.map(pr => `${pr.l} → ${pr.r}`).join('; ');
    case 'order': return q.items.join(' → ');
    case 'num': return `${sig(q.ans(p), 3)} ${q.unit || ''}`;
    case 'self': return q.model;
  }
  return '';
}

/* sichere Mini-Formatierung für Antworten von Claude */
function mdLite(t) {
  const lines = esc(t).split(/\n/);
  let out = '', inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const m = line.match(/^\s*[-•*]\s+(.*)/);
    if (m) { if (!inList) { out += '<ul style="margin:4px 0 6px;padding-left:20px">'; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (line.trim()) out += `<p style="margin:0 0 6px">${line}</p>`;
  }
  if (inList) out += '</ul>';
  return out;
}

  exp: 'Die Auslenkung auf dem Bogen ist $s = l\\cdot\\alpha$. Die Rückstellkraft wächst aber mit $\\sin\\alpha$, nicht mit $\\alpha$. Nur bei kleinen Winkeln (bis etwa 10°) gilt $\\sin\\alpha\\approx\\alpha$ und damit $F_R\\approx-\\frac{m g}{l}\\cdot s$.',
  learn: 'Fadenpendel: $F_R = -m g\\sin\\alpha$, harmonisch nur für kleine Winkel, dann $D = \\frac{m g}{l}$.' },

{ id: 'h7', area: 'harmonisch', afb: 3, type: 'cloze', tag: 'KETTE',
  q: 'Leite die Periodendauer aus der Differentialgleichung her. Wähle die passenden Ausdrücke.',
  text: R`Aus $\Fr = \Fres$ folgt $-D\cdot s(t) = m\cdot$ [[0]]. Mit dem Ansatz $s(t) = \sh\sin(\omega t)$ wird daraus $-D\,\sh\sin(\omega t) = -m\,\sh\cdot$ [[1]] $\cdot\sin(\omega t)$. Also gilt $\omega =$ [[2]] und $T =$ [[3]].`,
  blanks: [
    { o: ["s''(t)", "s'(t)", 's(t)'], a: 0 },
    { o: ['ω²', 'ω', '1/ω'], a: 0 },
    { o: ['√(D/m)', '√(m/D)', 'D/m'], a: 0 },
    { o: ['2π·√(m/D)', '2π·√(D/m)', '√(m/D)/(2π)'], a: 0 }],
  exp: R`Newton: $\Fres = m\cdot a = m\cdot s''(t)$. Zweimal ableiten liefert $s''(t) = -\sh\omega^2\sin(\omega t)$. Kürzen ergibt $D = m\omega^2$, also $\omega = \sqrt{D/m}$ und $T = \frac{2\pi}{\omega} = 2\pi\sqrt{m/D}$.`,
  learn: 'DGL: $-D\\cdot s = m\\cdot s\'\'$, Ansatz einsetzen ⇒ $D = m\\omega^2$ ⇒ $T = 2\\pi\\sqrt{m/D}$ (Mitschrift S. 5).' },

{ id: 'h8', area: 'harmonisch', afb: 3, type: 'self',
  q: 'Begründe ausführlich, dass ein senkrecht hängendes Federpendel harmonisch schwingt, und gib die Periodendauer an. (Oben sei positiv.)',
  model: R`In der Ruhelage ist die Feder um $s_0$ gedehnt, und es gilt $D\cdot s_0 = m\cdot g$. Wird der Körper um $s$ aus der Ruhelage ausgelenkt, ist die Feder um $s_0 - s$ gedehnt. Die resultierende Kraft ist $\Fres = D\cdot(s_0 - s) - m g = D s_0 - D s - D s_0 = -D\cdot s$. Die Rückstellkraft ist also proportional zur Auslenkung und ihr entgegengerichtet, $D$ ist konstant. Das lineare Kraftgesetz gilt, das Federpendel schwingt harmonisch mit $T = 2\pi\sqrt{m/D}$.`,
  rubric: [
    'In der Ruhelage gilt $D\\cdot s_0 = m\\cdot g$ (Federkraft gleich Gewichtskraft).',
    'Die Rückstellkraft ist die resultierende Kraft aus Federkraft und Gewichtskraft.',
    'Mit $m g = D s_0$ folgt $\\Fres = -D\\cdot s$.',
    'Die Rückstellkraft ist proportional zur Auslenkung und entgegengerichtet, $D$ ist konstant (lineares Kraftgesetz).',
    'Also harmonisch mit $T = 2\\pi\\sqrt{m/D}$.'],
  learn: 'Federpendel-Nachweis: $D s_0 = m g$ ⇒ $\\Fres = -D\\cdot s$ ⇒ harmonisch (Mitschrift S. 4).' },

{ id: 'h9', area: 'harmonisch', afb: 2, type: 'mc',
  q: R`Welche Funktion löst die Gleichung $m\cdot s''(t) = -D\cdot s(t)$?`,
  opts: [
    { t: R`$s(t) = \sh\sin(\omega t)$ mit $\omega = \sqrt{D/m}$`, ok: true },
    { t: R`$s(t) = c\cdot t^2$` },
    { t: R`$s(t) = \sh\cdot e^{-\omega t}$` },
    { t: R`$s(t) = \sh\sin(\omega t)$ mit $\omega = \sqrt{m/D}$`, tag: 'wurzel' }],
  exp: R`Zweimal Ableiten von $\sh\sin(\omega t)$ ergibt $-\omega^2\cdot s(t)$. Eingesetzt: $-m\omega^2 s = -D s$, also $\omega^2 = D/m$. Bei $c\cdot t^2$ wäre $s''$ konstant, bei der e-Funktion hätte $s''$ das falsche Vorzeichen.`,
  learn: 'Die Sinusfunktion löst die DGL, weil $s\'\' = -\\omega^2 s$ gilt. Dabei ist $\\omega = \\sqrt{D/m}$.' }
);

Q.push(
{ id: 'k1', area: 'kraefte', afb: 1, type: 'mc',
  q: 'Was gilt für ein senkrecht hängendes Federpendel in der Ruhelage?',
  opts: [
    { t: R`$D\cdot s_0 = m\cdot g$: Federkraft und Gewichtskraft sind gleich groß.`, ok: true },
    { t: 'Die Federkraft ist null, weil die Feder entspannt ist.' },
    { t: 'Die resultierende Kraft ist maximal.' },
    { t: R`$D = m\cdot g\cdot s_0$` }],
  exp: 'In der Ruhelage ist die resultierende Kraft null. Die Feder ist um $s_0$ gedehnt und zieht genau so stark nach oben, wie die Gewichtskraft nach unten zieht.',
  learn: 'Ruhelage: $D\\cdot s_0 = m\\cdot g$. Daraus lässt sich $D$ bestimmen.' },

{ id: 'k2', area: 'kraefte', afb: 2, type: 'num', unit: 'N/m', ask: 'D =',
  gen: r => ({ m: between(r, 100, 500, 50), s: between(r, 4, 20, 1) }),
  q: p => `Hängt man einen Körper der Masse ${p.m} g an eine Feder, dehnt sie sich um ${p.s} cm. Berechne die Federkonstante $D$.`,
  ans: p => (p.m / 1000) * G / (p.s / 100), tol: { rel: 0.02 },
  exp: p => `In der Ruhelage gilt $D\\cdot s_0 = m\\cdot g$, also $D = \\frac{m g}{s_0} = \\frac{${nf(p.m / 1000, 3)}\\,\\text{kg}\\cdot 9{,}81\\,\\frac{\\text{m}}{\\text{s}^2}}{${nf(p.s / 100, 2)}\\,\\text{m}}\\approx ${sig((p.m / 1000) * G / (p.s / 100), 3)}\\,\\frac{\\text{N}}{\\text{m}}$.`,
  learn: 'Federkonstante aus der Ruhedehnung: $D = \\frac{m g}{s_0}$. Vorher g in kg und cm in m umrechnen.' },

{ id: 'k3', area: 'kraefte', afb: 2, type: 'mc',
  q: 'Der Körper eines senkrechten Federpendels befindet sich 3 cm <b>unterhalb</b> der Gleichgewichtslage. Oben ist positiv. Was gilt?',
  opts: [
    { t: R`Die Federkraft ist größer als die Gewichtskraft, $\Fres$ zeigt nach oben ($\Fres>0$).`, ok: true },
    { t: R`Federkraft und Gewichtskraft sind gleich groß, $\Fres = 0$.` },
    { t: R`Die Federkraft ist kleiner als die Gewichtskraft, $\Fres$ zeigt nach unten.`, tag: 'SIGN' },
    { t: 'Die Federkraft ist null.' }],
  exp: R`Unterhalb der Gleichgewichtslage ist die Feder stärker gedehnt als in der Ruhelage: $\FF = D(s_0 + 3\,\text{cm}) > m g$. Die resultierende Kraft $+D\cdot 3\,\text{cm}$ zeigt nach oben, zur Gleichgewichtslage (Situation 4 in der Mitschrift).`,
  learn: 'Unter der GGL: $\\FF > \\FG$, $\\Fres > 0$. Über der GGL: $\\FF < \\FG$, $\\Fres < 0$.' },

{ id: 'k4', area: 'kraefte', afb: 2, type: 'num', unit: 'N', ask: '|F_Rück| =',
  gen: r => ({ D: between(r, 20, 80, 5), s: between(r, 2, 8, 1), m: pick(r, [0.5, 1, 1.5, 2]) }),
  q: p => `Ein Körper (${nf(p.m, 1)} kg) hängt in Ruhe an einer Feder mit $D = ${p.D}\\,\\frac{\\text{N}}{\\text{m}}$. Er wird ${p.s} cm nach unten gezogen. Wie groß ist der Betrag der Rückstellkraft?`,
  ans: p => p.D * p.s / 100, tol: { rel: 0.02 },
  traps: p => [{ v: p.D * p.s / 100 + p.m * G, tag: 'gewicht' }],
  exp: p => `Ab der Ruhelage gemessen heben sich Gewichtskraft und Vordehnung auf. Es zählt nur die zusätzliche Dehnung: $|\\Fr| = D\\cdot s = ${p.D}\\,\\frac{\\text{N}}{\\text{m}}\\cdot ${nf(p.s / 100, 2)}\\,\\text{m} = ${sig(p.D * p.s / 100, 3)}\\,\\text{N}$. Die Masse brauchst du dafür nicht.`,
  learn: 'Ab der Ruhelage gilt $|\\Fr| = D\\cdot s$, die Gewichtskraft ist schon durch die Vordehnung ausgeglichen.' },

{ id: 'k5', area: 'kraefte', afb: 1, type: 'mc',
  q: 'Welche Kraft treibt ein ausgelenktes Fadenpendel zurück?',
  opts: [
    { t: R`Die Komponente der Gewichtskraft tangential zur Kreisbahn: $F_R = -m g\sin\alpha$.`, ok: true },
    { t: 'Die Fadenkraft.' },
    { t: R`Die gesamte Gewichtskraft $m\cdot g$.` },
    { t: R`Die Komponente der Gewichtskraft in Fadenrichtung: $m g\cos\alpha$.`, tag: 'sincos' }],
  exp: 'Man zerlegt die Gewichtskraft in eine Komponente entlang des Fadens und eine senkrecht dazu. Die Komponente entlang des Fadens wird vom Faden aufgenommen. Die tangentiale Komponente $m g\\sin\\alpha$ treibt den Körper zur Mitte.',
  learn: 'Fadenpendel: $F_R = -m g\\sin\\alpha$ (Gegenkathete zu $\\alpha$ im Kräftedreieck).' },

{ id: 'k6', area: 'kraefte', afb: 2, type: 'num', unit: 'N', ask: 'F_R =',
  gen: r => ({ m: between(r, 0.1, 1.0, 0.05), a: between(r, 5, 20, 1) }),
  q: p => `Ein Fadenpendel mit $m = ${nf(p.m, 2)}\\,\\text{kg}$ ist um $\\alpha = ${p.a}°$ ausgelenkt. Berechne den Betrag der Rückstellkraft.`,
  ans: p => p.m * G * Math.sin(p.a * Math.PI / 180), tol: { rel: 0.012 },
  traps: p => [{ v: Math.abs(p.m * G * Math.sin(p.a)), tag: 'rad' }, { v: p.m * G * Math.cos(p.a * Math.PI / 180), tag: 'sincos' }],
  exp: p => `$F_R = m\\cdot g\\cdot\\sin\\alpha = ${nf(p.m, 2)}\\,\\text{kg}\\cdot 9{,}81\\,\\frac{\\text{m}}{\\text{s}^2}\\cdot\\sin(${p.a}°)\\approx ${sig(p.m * G * Math.sin(p.a * Math.PI / 180), 3)}\\,\\text{N}$. Der Winkel ist in Grad gegeben, der Taschenrechner muss also auf DEG stehen.`,
  learn: '$F_R = m g\\sin\\alpha$. Winkel in Grad ⇒ DEG, $\\omega t$ im Sinus ⇒ RAD.' },

{ id: 'k7', area: 'kraefte', afb: 2, type: 'mc',
  q: 'Was gilt für die Fadenkraft eines Fadenpendels beim Durchgang durch den tiefsten Punkt?',
  opts: [
    { t: 'Sie ist größer als die Gewichtskraft, weil zusätzlich die Zentripetalkraft für die Kreisbahn nötig ist.', ok: true },
    { t: 'Sie ist genau so groß wie die Gewichtskraft.' },
    { t: 'Sie ist kleiner als die Gewichtskraft.' },
    { t: 'Sie ist null, weil dort keine Rückstellkraft wirkt.' }],
  exp: R`Der Körper bewegt sich auf einer Kreisbahn, dafür braucht er eine Zentripetalkraft zum Aufhängepunkt: $F_Z = \Fz - F_{\text{rad}}$. Also $\Fz = F_{\text{rad}} + F_Z$. Im tiefsten Punkt ist $F_{\text{rad}} = m g$ und $v$ maximal, deshalb ist die Fadenkraft dort am größten.`,
  learn: '$\\Fz = F_{\\text{rad}} + F_Z$. Im tiefsten Punkt ist die Fadenkraft größer als $m g$ (Mitschrift S. 2).' },

{ id: 'k8', area: 'kraefte', afb: 2, type: 'mc',
  q: 'Welche Kraft ist beim senkrecht hängenden Federpendel die Rückstellkraft?',
  opts: [
    { t: 'Die resultierende Kraft aus Federkraft und Gewichtskraft.', ok: true },
    { t: 'Die Federkraft allein.', tag: 'RES' },
    { t: 'Die Gewichtskraft allein.', tag: 'RES' },
    { t: 'Die Trägheit des Körpers.' }],
  exp: R`Auf den Körper wirken Federkraft und Gewichtskraft. Was ihn zurücktreibt, ist ihre Summe: $\Fr = \Fres = \FF - \FG$. Die Federkraft allein ist in der Ruhelage nicht null, die Rückstellkraft schon.`,
  learn: '$\\Fr = \\Fres = \\FF - \\FG$ (Ergebnis 1 beim Federpendel, Mitschrift S. 4).' }
);
/* ---------- Aufgaben: Bewegungsgesetze, Rechnen, Abhängigkeiten ---------- */
Q.push(
{ id: 'v1', area: 'bewegung', afb: 1, type: 'mc',
  q: R`Ein Körper schwingt nach $s(t) = \sh\sin(\omega t)$. Welches Gesetz beschreibt seine Geschwindigkeit?`,
  opts: [
    { t: R`$v(t) = \sh\,\omega\cos(\omega t)$`, ok: true },
    { t: R`$v(t) = \sh\cos(\omega t)$`, tag: 'KETTE' },
    { t: R`$v(t) = -\sh\,\omega\cos(\omega t)$`, tag: 'SIGN' },
    { t: R`$v(t) = \sh\,\omega^2\sin(\omega t)$` }],
  exp: R`$v = s'(t)$. Die Ableitung von $\sin(\omega t)$ ist nach der Kettenregel $\omega\cos(\omega t)$. Also $v(t) = \sh\omega\cos(\omega t)$ mit $\vh = \sh\omega$.`,
  learn: '$v(t) = s\'(t) = \\sh\\omega\\cos(\\omega t)$. Die Kettenregel liefert den Faktor $\\omega$.' },

{ id: 'v2', area: 'bewegung', afb: 1, type: 'mc',
  q: R`Wie lautet das t-a-Gesetz zu $s(t) = \sh\sin(\omega t)$?`,
  opts: [
    { t: R`$a(t) = -\sh\,\omega^2\sin(\omega t)$`, ok: true },
    { t: R`$a(t) = \sh\,\omega^2\sin(\omega t)$`, tag: 'SIGN' },
    { t: R`$a(t) = -\sh\,\omega\cos(\omega t)$`, tag: 'KETTE' },
    { t: R`$a(t) = \sh\,\omega^2\cos(\omega t)$` }],
  exp: R`$a = v'(t)$: Aus $\cos$ wird $-\sin$, und es kommt noch einmal $\omega$ dazu. Also $a(t) = -\sh\omega^2\sin(\omega t) = -\omega^2\cdot s(t)$.`,
  learn: '$a(t) = -\\sh\\omega^2\\sin(\\omega t) = -\\omega^2 s(t)$, $\\ah = \\sh\\omega^2$.' },

{ id: 'v3', area: 'bewegung', afb: 1, type: 'cloze', tag: 'VMAX',
  q: 'Wo ist was maximal? Vervollständige.',
  text: 'In der Gleichgewichtslage ist der Betrag der Geschwindigkeit [[0]] und die Beschleunigung [[1]]. An den Umkehrpunkten ist die Geschwindigkeit [[2]] und der Betrag der Beschleunigung [[3]].',
  blanks: [{ o: ['maximal', 'null'], a: 0 }, { o: ['null', 'maximal'], a: 0 }, { o: ['null', 'maximal'], a: 0 }, { o: ['maximal', 'null'], a: 0 }],
  exp: 'Wegen $a = -\\omega^2 s$ ist die Beschleunigung dort am größten, wo die Auslenkung am größten ist, also an den Umkehrpunkten. Dort kehrt der Körper um, $v = 0$. In der Gleichgewichtslage ist $s = 0$, also $a = 0$, und der Körper ist am schnellsten.',
  learn: 'GGL: $|v|$ maximal, $a = 0$. Umkehrpunkt: $v = 0$, $|a|$ und $|\\Fr|$ maximal.' },

{ id: 'v4', area: 'bewegung', afb: 2, type: 'mc',
  q: 'Um welchen Phasenwinkel eilt die Geschwindigkeit der Auslenkung voraus?',
  opts: [{ t: '90°, also eine Viertelperiode', ok: true }, { t: '0°, beide sind gleichphasig' }, { t: '180°, also eine halbe Periode' }, { t: '45°, also eine Achtelperiode' }],
  exp: R`$v(t) = \sh\omega\cos(\omega t) = \sh\omega\sin(\omega t + 90°)$. Die v-Kurve erreicht ihr Maximum eine Viertelperiode vor der s-Kurve. Die Beschleunigung ist zur Auslenkung gegenphasig (180°).`,
  learn: '$v$ eilt $s$ um 90° ($T/4$) voraus, $a$ ist zu $s$ gegenphasig.' },

{ id: 'v5', area: 'bewegung', afb: 2, type: 'mc',
  q: 'Welche Beziehung gilt bei einer harmonischen Schwingung zu jedem Zeitpunkt?',
  opts: [{ t: R`$a(t) = -\omega^2\cdot s(t)$`, ok: true }, { t: R`$a(t) = \omega^2\cdot s(t)$`, tag: 'SIGN' }, { t: R`$v(t) = \omega\cdot s(t)$` }, { t: R`$a(t) = -\omega\cdot v(t)$` }],
  exp: R`Vergleich von $s(t) = \sh\sin(\omega t)$ und $a(t) = -\sh\omega^2\sin(\omega t)$ zeigt $a = -\omega^2 s$. Mit $F = m a$ ist das genau das lineare Kraftgesetz: $F = -m\omega^2 s = -D s$.`,
  learn: '$a = -\\omega^2 s$ ist das lineare Kraftgesetz in anderer Form ($D = m\\omega^2$).' },

{ id: 'v6', area: 'bewegung', afb: 2, type: 'mc',
  q: 'Ein Federpendel wird 5 cm nach <b>unten</b> ausgelenkt und bei $t = 0$ losgelassen. Oben ist positiv. Welches Zeit-Ort-Gesetz passt?',
  opts: [
    { t: R`$s(t) = -5\,\text{cm}\cdot\cos(\omega t)$`, ok: true },
    { t: R`$s(t) = 5\,\text{cm}\cdot\sin(\omega t)$`, tag: 'START' },
    { t: R`$s(t) = 5\,\text{cm}\cdot\cos(\omega t)$`, tag: 'START' },
    { t: R`$s(t) = -5\,\text{cm}\cdot\sin(\omega t)$`, tag: 'START' }],
  exp: R`Bei $t = 0$ muss $s = -5\,\text{cm}$ sein, und der Körper startet in Ruhe. Das erfüllt nur $-\sh\cos(\omega t)$. Gleichwertig ist $\sh\sin(\omega(t - \frac{T}{4}))$ wie in der Sekundenpendel-Aufgabe.`,
  learn: 'Unten losgelassen: $s = -\\sh\\cos(\\omega t)$. Oben losgelassen: $s = \\sh\\cos(\\omega t)$.' },

{ id: 'v7', area: 'bewegung', afb: 2, type: 'num', unit: 'm/s', ask: 'v̂ =',
  gen: r => ({ s: between(r, 3, 12, 1), T: between(r, 0.6, 2.0, 0.1) }),
  q: p => `Ein Körper schwingt harmonisch mit der Amplitude ${p.s} cm und der Periodendauer ${nf(p.T, 1)} s. Berechne den Betrag der maximalen Geschwindigkeit $\\vh$.`,
  ans: p => p.s / 100 * 2 * Math.PI / p.T, tol: { rel: 0.02 },
  traps: p => [{ v: p.s / 100 / p.T, tag: 'zweipi' }, { v: p.s / 100 * p.T / (2 * Math.PI), tag: 'zweipi' }],
  exp: p => `$\\omega = \\frac{2\\pi}{T} = ${sig(2 * Math.PI / p.T, 3)}\\,\\frac{1}{\\text{s}}$, also $\\vh = \\sh\\cdot\\omega = ${nf(p.s / 100, 2)}\\,\\text{m}\\cdot ${sig(2 * Math.PI / p.T, 3)}\\,\\frac{1}{\\text{s}}\\approx ${sig(p.s / 100 * 2 * Math.PI / p.T, 3)}\\,\\frac{\\text{m}}{\\text{s}}$.`,
  learn: '$\\vh = \\sh\\cdot\\omega$ mit $\\omega = \\frac{2\\pi}{T}$. Amplitude vorher in m umrechnen.' },

{ id: 'v8', area: 'bewegung', afb: 2, type: 'num', unit: 'm/s²', ask: 'â =',
  gen: r => ({ s: between(r, 2, 10, 1), w: between(r, 4, 15, 1) }),
  q: p => `Ein Körper schwingt mit $\\omega = ${p.w}\\,\\frac{1}{\\text{s}}$ und der Amplitude ${p.s} cm. Wie groß ist der Betrag der maximalen Beschleunigung $\\ah$?`,
  ans: p => p.s / 100 * p.w * p.w, tol: { rel: 0.02 },
  traps: p => [{ v: p.s / 100 * p.w, tag: 'quadrat' }],
  exp: p => `$\\ah = \\sh\\cdot\\omega^2 = ${nf(p.s / 100, 2)}\\,\\text{m}\\cdot(${p.w}\\,\\frac{1}{\\text{s}})^2 = ${sig(p.s / 100 * p.w * p.w, 3)}\\,\\frac{\\text{m}}{\\text{s}^2}$. Mit $\\sh\\cdot\\omega$ hättest du $\\vh$ berechnet.`,
  learn: '$\\ah = \\sh\\omega^2 = \\vh\\omega$.' },

{ id: 'v9', area: 'bewegung', afb: 3, type: 'num', unit: 'm', ask: 's =',
  gen: r => { const T = pick(r, [0.8, 1, 1.2, 1.5, 2]); const k = pick(r, [2, 3]); const ph = pick(r, [0.1, 0.15, 0.35, 0.4, 0.6, 0.65, 0.85, 0.9]); return { s: pick(r, [0.05, 0.08, 0.1, 0.12]), T, t: +((k + ph) * T).toFixed(1) }; },
  q: p => `Ein Federpendel mit $T = ${nf(p.T, 1)}\\,\\text{s}$ wird um ${nf(p.s, 2)} m nach unten ausgelenkt und bei $t = 0$ losgelassen. Oben ist positiv. Wo befindet sich der Körper zur Zeit $t = ${nf(p.t, 1)}\\,\\text{s}$? Gib $s$ mit Vorzeichen in m an.`,
  ans: p => -p.s * Math.cos(2 * Math.PI * p.t / p.T), tol: p => ({ abs: 0.025 * p.s }),
  traps: p => [
    { v: -p.s * Math.cos(2 * Math.PI * p.t / p.T * Math.PI / 180), tag: 'rad' },
    { v: p.s * Math.sin(2 * Math.PI * p.t / p.T), tag: 'START' },
    { v: p.s * Math.cos(2 * Math.PI * p.t / p.T), tag: 'START' }],
  exp: p => `Start unten: $s(t) = -\\sh\\cos(\\omega t)$ mit $\\omega = \\frac{2\\pi}{T}$. Also $s = -${nf(p.s, 2)}\\,\\text{m}\\cdot\\cos\\big(\\frac{2\\pi}{${nf(p.T, 1)}\\,\\text{s}}\\cdot ${nf(p.t, 1)}\\,\\text{s}\\big)\\approx ${sig(-p.s * Math.cos(2 * Math.PI * p.t / p.T), 2)}\\,\\text{m}$ (Rechner auf RAD). ${-p.s * Math.cos(2 * Math.PI * p.t / p.T) >= 0 ? 'Der Körper ist oberhalb' : 'Der Körper ist unterhalb'} der Gleichgewichtslage.`,
  learn: 'Zeit-Ort-Gesetz mit Startbedingung aufstellen, dann einsetzen. Taschenrechner auf RAD (Mitschrift S. 7).' },

{ id: 'v10', area: 'bewegung', afb: 3, type: 'num', unit: 'm/s', ask: 'v =',
  gen: r => { const T = pick(r, [0.8, 1, 1.2, 1.5, 2]); const k = pick(r, [2, 3]); const ph = pick(r, [0.1, 0.15, 0.35, 0.4, 0.6, 0.65, 0.85, 0.9]); return { s: pick(r, [0.05, 0.08, 0.1, 0.12]), T, t: +((k + ph) * T).toFixed(1) }; },
  q: p => `Dasselbe Pendel wie beim Sekundenpendel: $T = ${nf(p.T, 1)}\\,\\text{s}$, bei $t = 0$ aus ${nf(p.s, 2)} m unterhalb der Gleichgewichtslage losgelassen, oben positiv. Berechne die Geschwindigkeit $v$ mit Vorzeichen zur Zeit $t = ${nf(p.t, 1)}\\,\\text{s}$.`,
  ans: p => p.s * 2 * Math.PI / p.T * Math.sin(2 * Math.PI * p.t / p.T), tol: p => ({ abs: 0.025 * p.s * 2 * Math.PI / p.T }),
  traps: p => [
    { v: -p.s * 2 * Math.PI / p.T * Math.sin(2 * Math.PI * p.t / p.T), tag: 'vorzeichen' },
    { v: p.s * 2 * Math.PI / p.T * Math.sin(2 * Math.PI * p.t / p.T * Math.PI / 180), tag: 'rad' },
    { v: p.s * Math.sin(2 * Math.PI * p.t / p.T), tag: 'KETTE' }],
  exp: p => { const w = 2 * Math.PI / p.T, v = p.s * w * Math.sin(w * p.t); return `Aus $s(t) = -\\sh\\cos(\\omega t)$ folgt $v(t) = \\sh\\omega\\sin(\\omega t)$. Mit $\\omega = ${sig(w, 3)}\\,\\frac{1}{\\text{s}}$: $v = ${sig(v, 2)}\\,\\frac{\\text{m}}{\\text{s}}$. ${v < 0 ? 'Negativ heißt: Der Körper bewegt sich gerade nach unten.' : 'Positiv heißt: Der Körper bewegt sich gerade nach oben.'}`; },
  learn: 'Vorzeichen von $v$ deuten: negativ = Bewegung nach unten (oben positiv).' }
);

Q.push(
{ id: 'r1', area: 'rechnen', afb: 1, type: 'num', unit: 's', ask: 'T =',
  gen: r => ({ m: between(r, 50, 800, 50), D: between(r, 5, 60, 1) }),
  q: p => `An einer Feder mit $D = ${p.D}\\,\\frac{\\text{N}}{\\text{m}}$ hängt ein Körper der Masse ${p.m} g. Berechne die Periodendauer.`,
  ans: p => 2 * Math.PI * Math.sqrt(p.m / 1000 / p.D), tol: { rel: 0.02 },
  traps: p => [{ v: 2 * Math.PI * Math.sqrt(p.m / p.D), tag: 'einheit' }, { v: Math.sqrt(p.m / 1000 / p.D), tag: 'zweipi' }, { v: 2 * Math.PI * Math.sqrt(p.D / (p.m / 1000)), tag: 'wurzel' }],
  exp: p => `$T = 2\\pi\\sqrt{\\frac{m}{D}} = 2\\pi\\sqrt{\\frac{${nf(p.m / 1000, 3)}\\,\\text{kg}}{${p.D}\\,\\text{N/m}}}\\approx ${sig(2 * Math.PI * Math.sqrt(p.m / 1000 / p.D), 3)}\\,\\text{s}$. Die Masse muss in kg eingesetzt werden.`,
  learn: '$T = 2\\pi\\sqrt{m/D}$ mit $m$ in kg und $D$ in N/m.' },

{ id: 'r2', area: 'rechnen', afb: 2, type: 'num', unit: 'N/m', ask: 'D =',
  gen: r => { const n = pick(r, [5, 10, 20]); const T = between(r, 0.4, 1.6, 0.05); return { n, t: +(n * T).toFixed(1), m: between(r, 0.2, 3, 0.1) }; },
  q: p => `Ein Körper der Masse ${nf(p.m, 1)} kg schwingt an einer Feder. Für ${p.n} Perioden misst man ${nf(p.t, 1)} s. Berechne die Federkonstante $D$.`,
  ans: p => 4 * Math.PI ** 2 * p.m / (p.t / p.n) ** 2, tol: { rel: 0.02 },
  traps: p => [{ v: 4 * Math.PI ** 2 * p.m / p.t ** 2, tag: 'messung' }, { v: 4 * Math.PI ** 2 * p.m / (p.t / p.n), tag: 'wurzel' }, { v: 2 * Math.PI * p.m / (p.t / p.n) ** 2, tag: 'wurzel' }],
  exp: p => { const T = p.t / p.n; return `Erst $T = \\frac{${nf(p.t, 1)}\\,\\text{s}}{${p.n}} = ${sig(T, 3)}\\,\\text{s}$. Dann $D = \\frac{4\\pi^2 m}{T^2} = \\frac{4\\pi^2\\cdot ${nf(p.m, 1)}\\,\\text{kg}}{(${sig(T, 3)}\\,\\text{s})^2}\\approx ${sig(4 * Math.PI ** 2 * p.m / T ** 2, 3)}\\,\\frac{\\text{N}}{\\text{m}}$.`; },
  learn: '$D = \\frac{4\\pi^2 m}{T^2}$, vorher $T = t/n$ aus der Messung.' },

{ id: 'r3', area: 'rechnen', afb: 2, type: 'num', unit: 'kg', ask: 'm =',
  gen: r => ({ D: between(r, 4, 40, 0.5), T: between(r, 0.5, 2, 0.1) }),
  q: p => `Welche Masse muss man an eine Feder mit $D = ${nf(p.D, 1)}\\,\\frac{\\text{N}}{\\text{m}}$ hängen, damit das Pendel mit $T = ${nf(p.T, 1)}\\,\\text{s}$ schwingt?`,
  ans: p => p.D * (p.T / (2 * Math.PI)) ** 2, tol: { rel: 0.02 },
  traps: p => [{ v: p.D * p.T / (2 * Math.PI), tag: 'wurzel' }, { v: p.D * p.T ** 2 / (2 * Math.PI), tag: 'wurzel' }],
  exp: p => `$T = 2\\pi\\sqrt{\\frac{m}{D}}$ nach $m$ umstellen: durch $2\\pi$ teilen, quadrieren, mal $D$. $m = D\\cdot\\big(\\frac{T}{2\\pi}\\big)^2 = ${nf(p.D, 1)}\\cdot\\big(\\frac{${nf(p.T, 1)}}{2\\pi}\\big)^2\\,\\text{kg}\\approx ${sig(p.D * (p.T / (2 * Math.PI)) ** 2, 3)}\\,\\text{kg}$.`,
  learn: '$m = D\\cdot\\big(\\frac{T}{2\\pi}\\big)^2$ (wie beim Sekundenpendel, Mitschrift S. 7).' },

{ id: 'r4', area: 'rechnen', afb: 1, type: 'num', unit: '1/s', ask: 'ω =',
  gen: r => ({ T: between(r, 0.2, 3, 0.1) }),
  q: p => `Ein Pendel hat die Periodendauer $T = ${nf(p.T, 1)}\\,\\text{s}$. Berechne die Kreisfrequenz $\\omega$.`,
  ans: p => 2 * Math.PI / p.T, tol: { rel: 0.02 },
  traps: p => [{ v: p.T / (2 * Math.PI), tag: 'zweipi' }, { v: 1 / p.T, tag: 'zweipi' }],
  exp: p => `$\\omega = \\frac{2\\pi}{T} = \\frac{2\\pi}{${nf(p.T, 1)}\\,\\text{s}}\\approx ${sig(2 * Math.PI / p.T, 3)}\\,\\frac{1}{\\text{s}}$. Mit $\\frac{1}{T}$ hättest du die Frequenz $f$ berechnet.`,
  learn: '$\\omega = \\frac{2\\pi}{T}$, $f = \\frac{1}{T}$.' },

{ id: 'r5', area: 'rechnen', afb: 2, type: 'num', unit: 'Hz', ask: 'f =',
  gen: r => ({ D: between(r, 10, 80, 5), m: between(r, 0.1, 1.5, 0.1) }),
  q: p => `Berechne die Frequenz eines Federpendels mit $D = ${p.D}\\,\\frac{\\text{N}}{\\text{m}}$ und $m = ${nf(p.m, 1)}\\,\\text{kg}$.`,
  ans: p => Math.sqrt(p.D / p.m) / (2 * Math.PI), tol: { rel: 0.02 },
  traps: p => [{ v: Math.sqrt(p.D / p.m), tag: 'zweipi' }, { v: 2 * Math.PI * Math.sqrt(p.m / p.D), tag: 'FT' }],
  exp: p => `$\\omega = \\sqrt{\\frac{D}{m}} = ${sig(Math.sqrt(p.D / p.m), 3)}\\,\\frac{1}{\\text{s}}$ und $f = \\frac{\\omega}{2\\pi}\\approx ${sig(Math.sqrt(p.D / p.m) / (2 * Math.PI), 3)}\\,\\text{Hz}$. Oder: $T = 2\\pi\\sqrt{m/D}$ und $f = 1/T$.`,
  learn: '$f = \\frac{1}{T} = \\frac{1}{2\\pi}\\sqrt{\\frac{D}{m}}$. Nicht $\\omega$ mit $f$ verwechseln.' },

{ id: 'r6', area: 'rechnen', afb: 3, type: 'num', unit: 's', ask: 'T =',
  gen: r => ({ s: between(r, 2, 25, 1) }),
  q: p => `Ein Körper dehnt eine Feder in Ruhe um ${p.s} cm. Mit welcher Periodendauer schwingt er? (Die Masse ist nicht bekannt.)`,
  ans: p => 2 * Math.PI * Math.sqrt(p.s / 100 / G), tol: { rel: 0.02 },
  traps: p => [{ v: Math.sqrt(p.s / 100 / G), tag: 'zweipi' }],
  exp: p => `Aus $D s_0 = m g$ folgt $\\frac{m}{D} = \\frac{s_0}{g}$. Damit $T = 2\\pi\\sqrt{\\frac{m}{D}} = 2\\pi\\sqrt{\\frac{s_0}{g}} = 2\\pi\\sqrt{\\frac{${nf(p.s / 100, 2)}\\,\\text{m}}{9{,}81\\,\\text{m/s}^2}}\\approx ${sig(2 * Math.PI * Math.sqrt(p.s / 100 / G), 3)}\\,\\text{s}$. Die Masse kürzt sich heraus.`,
  learn: 'Trick: $\\frac{m}{D} = \\frac{s_0}{g}$, also $T = 2\\pi\\sqrt{s_0/g}$.' },

{ id: 'r7', area: 'rechnen', afb: 3, type: 'num', unit: 'g', ask: 'Δm =',
  gen: r => { const T1 = pick(r, [0.6, 0.8, 1.0, 1.2]); return { m: between(r, 100, 500, 50), T1, T2: +(T1 * pick(r, [1.5, 2, 1.25])).toFixed(2) }; },
  q: p => `Ein Federpendel mit ${p.m} g schwingt mit $T = ${nf(p.T1, 2)}\\,\\text{s}$. Wie viel Masse muss man zusätzlich anhängen, damit es mit $T = ${nf(p.T2, 2)}\\,\\text{s}$ schwingt?`,
  ans: p => p.m * ((p.T2 / p.T1) ** 2 - 1), tol: { rel: 0.02 },
  traps: p => [{ v: p.m * (p.T2 / p.T1 - 1), tag: 'linear' }, { v: p.m * (p.T2 / p.T1) ** 2, tag: 'linear' }],
  exp: p => { const k = p.T2 / p.T1; return `$T\\sim\\sqrt{m}$, also $m\\sim T^2$. Neue Masse: $m_2 = m_1\\cdot\\big(\\frac{T_2}{T_1}\\big)^2 = ${p.m}\\,\\text{g}\\cdot ${nf(k, 2)}^2 = ${sig(p.m * k * k, 3)}\\,\\text{g}$. Zusätzlich also $\\Delta m = ${sig(p.m * (k * k - 1), 3)}\\,\\text{g}$.`; },
  learn: 'Aus $T\\sim\\sqrt{m}$ folgt $m\\sim T^2$: $\\frac{m_2}{m_1} = \\big(\\frac{T_2}{T_1}\\big)^2$.' },

{ id: 'r8', area: 'rechnen', afb: 2, type: 'mc',
  q: R`Welche Umformung von $T = 2\pi\sqrt{\frac{m}{D}}$ ist richtig?`,
  opts: [
    { t: R`$D = \frac{4\pi^2\cdot m}{T^2}$`, ok: true },
    { t: R`$D = \frac{2\pi\cdot m}{T^2}$`, tag: 'wurzel' },
    { t: R`$D = \frac{4\pi^2\cdot T^2}{m}$` },
    { t: R`$D = \frac{2\pi}{T}\cdot m$`, tag: 'wurzel' }],
  exp: R`Durch $2\pi$ teilen: $\frac{T}{2\pi} = \sqrt{\frac{m}{D}}$. Quadrieren: $\frac{T^2}{4\pi^2} = \frac{m}{D}$. Nach $D$ auflösen: $D = \frac{4\pi^2 m}{T^2}$. Beim Quadrieren wird auch $2\pi$ quadriert.`,
  learn: '$D = \\frac{4\\pi^2 m}{T^2} = m\\omega^2$.' }
);

Q.push(
{ id: 'a1', area: 'abh', afb: 1, type: 'mc', fixed: true,
  q: 'Die Masse an einem Federpendel wird vervierfacht. Die Periodendauer …',
  opts: [{ t: '… verdoppelt sich.', ok: true }, { t: '… vervierfacht sich.', tag: 'SQRT' }, { t: '… halbiert sich.' }, { t: '… bleibt gleich.', tag: 'GRAV' }],
  exp: '$T = 2\\pi\\sqrt{m/D}$, also $T\\sim\\sqrt{m}$. Vierfache Masse ergibt $\\sqrt4 = 2$, also doppelte Periodendauer.',
  learn: '$T\\sim\\sqrt{m}$: Masse mal 4 ⇒ $T$ mal 2.' },

{ id: 'a2', area: 'abh', afb: 1, type: 'mc', fixed: true,

  exp: 'Federpendel: $T = 2\\pi\\sqrt{m/D}$ enthält kein $g$, die Masse bleibt auf dem Mond gleich. Fadenpendel: $T = 2\\pi\\sqrt{l/g}$ wird bei kleinerem $g$ größer.',
  learn: 'Federpendel unabhängig von $g$, Fadenpendel $T\\sim 1/\\sqrt{g}$.' },

{ id: 'a4', area: 'abh', afb: 2, type: 'mc', fixed: true,
  q: 'Man ersetzt die Feder durch eine viermal so harte Feder (vierfaches $D$, gleiche Masse). Die Periodendauer …',
  opts: [{ t: '… halbiert sich.', ok: true }, { t: '… verdoppelt sich.' }, { t: '… wird ein Viertel so groß.', tag: 'SQRT' }, { t: '… bleibt gleich.' }],
  exp: '$T\\sim\\frac{1}{\\sqrt{D}}$. Vierfaches $D$ ergibt $\\frac{1}{\\sqrt4} = \\frac12$. Eine härtere Feder zieht stärker zurück, das Pendel schwingt schneller.',
  learn: '$T\\sim 1/\\sqrt{D}$: $D$ mal 4 ⇒ $T$ halb so groß.' },

{ id: 'a5', area: 'abh', afb: 2, type: 'mc', fixed: true,
  q: 'Wie muss man die Länge eines Fadenpendels ändern, damit sich die Periodendauer verdoppelt?',
  opts: [{ t: 'vervierfachen', ok: true }, { t: 'verdoppeln', tag: 'SQRT' }, { t: 'halbieren' }, { t: 'um den Faktor √2 vergrößern', tag: 'SQRT' }],
  exp: '$T = 2\\pi\\sqrt{l/g}$, also $T\\sim\\sqrt{l}$ bzw. $T^2\\sim l$. Für doppeltes $T$ braucht man $2^2 = 4$-fache Länge. Das zeigt auch die Messreihe: $T^2$ ist proportional zu $l$.',

{ id: 'a6', area: 'abh', afb: 2, type: 'multi',

{ id: 'a7', area: 'abh', afb: 3, type: 'mc',

  learn: 'Amplitude mal 2 ⇒ $T$ gleich, $\\vh$ mal 2, $\\ah$ mal 2, $E$ mal 4.' },

{ id: 'a8', area: 'abh', afb: 2, type: 'mc', grid: true,
  q: 'Man misst die Periodendauer eines Federpendels für verschiedene Massen und trägt $T$ über $m$ auf. Welcher Graph entsteht?',

{ id: 'a9', area: 'abh', afb: 2, type: 'mc', fixed: true,
  q: 'Ein Federpendel schwingt mit $T = 1{,}2\\,\\text{s}$. Die Masse wird verdoppelt. Wie groß ist die neue Periodendauer?',

{ id: 'e5', area: 'energie', afb: 2, type: 'mc', fixed: true,

{ id: 'e7', area: 'energie', afb: 2, type: 'multi',
